# The same gate the local `Stop` hook enforces, run where the hook cannot: a
# pull request opened from a cloud session, or any merge that did not pass
# through this machine. Keep the steps in sync with the `rumbo-verify`
# skill — that skill is the source of truth for "is this ready?", this file is
# only its unattended copy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a quick second commit should cancel the run it supersedes;
# nobody reads a result for a SHA that is no longer the branch tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · i18n · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheapest first, so an obvious failure does not wait on a build.
      - name: Lint
        run: npm run lint

      # There is no `typecheck` npm script — this is the real command.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: i18n coverage
        run: npm run i18n:check

      # Vitest unit suite (RUM-010a). Pure logic only: no database, no
      # credentials, no browser. `npm run db:test` is deliberately not here —
      # it runs against the live project. See docs/testing.md.
      - name: Unit tests
        run: npm test

      # Every route is server-rendered on demand, so the build never reaches
      # Supabase; these values exist only so the client factory has something
      # well-formed to read. Nothing here authenticates against anything, and
      # no secret belongs in this file.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key

  # RUM-010b: the ledger invariants (supabase/tests/) against GENERATED data,
  # never the live project. A private Postgres is started from the server
  # binaries the ubuntu image already ships, every migration is applied, the
  # fixtures in supabase/local/ are loaded through the app's own RPCs, and
  # every check must pass for both fixture households. No secrets, no
  # network beyond checkout. See docs/testing.md and docs/release-checklist.md.
  db-invariants:
    name: ledger invariants on fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only node built-ins and psql are needed — no npm ci.
      - name: Ledger invariants (local Postgres + fixtures)
        run: npm run db:local -- --bench

  # The transaction entry dialog in a real browser (e2e/entry/): the scenarios
  # each pin down something a phone run found broken — the form not fitting
  # one screen, the keyboard moving it, a double tap saving twice, the batch
  # confirmation, the exchange-rate screen. The app is built against the
  # Supabase stand-in in e2e/entry/mock-supabase.mjs, so nothing here touches
  # a database or needs a secret. See docs/testing.md.
  entry-e2e:
    name: entry form in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Not a project dependency (docs/testing.md), so installed for this job only.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      # NEXT_PUBLIC_* is baked in at build time: this build talks to the
      # stand-in that `e2e:entry` starts on port 54321.
      - name: Build against the Supabase stand-in
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e

      - name: Entry scenarios
        run: npm run e2e:entry
