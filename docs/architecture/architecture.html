<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Finanzas — Mapa de arquitectura</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --bg-canvas: #0d1218;
    --grid: rgba(255,255,255,.035);
    --panel: #111823;
    --panel-2: #0e141d;
    --border: rgba(255,255,255,.10);
    --border-strong: rgba(255,255,255,.20);
    --text: #e8edf4;
    --text-dim: #93a1b4;
    --text-faint: #64748b;
    --accent: #5eb0ff;
    --accent-soft: rgba(94,176,255,.14);
    --node-bg: #172130;
    --node-bg-2: #131c28;
    --shadow: 0 8px 28px rgba(0,0,0,.45);

    --l-client:  #7dd3fc;
    --l-edge:    #a78bfa;
    --l-routes:  #60a5fa;
    --l-actions: #f472b6;
    --l-lib:     #fbbf24;
    --l-data:    #34d399;
    --l-rpc:     #fb923c;
    --l-db:      #4ade80;
    --l-platform:#94a3b8;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f7fa;
    --bg-canvas: #fbfcfe;
    --grid: rgba(15,23,42,.05);
    --panel: #ffffff;
    --panel-2: #f2f5f9;
    --border: rgba(15,23,42,.12);
    --border-strong: rgba(15,23,42,.28);
    --text: #0f1b2d;
    --text-dim: #4a5a70;
    --text-faint: #7b8aa0;
    --accent: #0f6fd1;
    --accent-soft: rgba(15,111,209,.10);
    --node-bg: #ffffff;
    --node-bg-2: #f6f9fc;
    --shadow: 0 6px 20px rgba(15,23,42,.10);

    --l-client:  #0284c7;
    --l-edge:    #7c3aed;
    --l-routes:  #2563eb;
    --l-actions: #db2777;
    --l-lib:     #b45309;
    --l-data:    #047857;
    --l-rpc:     #c2410c;
    --l-db:      #15803d;
    --l-platform:#475569;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  @media (max-width: 1024px) { body { overflow-y: auto; overflow-x: hidden; } }

  button { font: inherit; color: inherit; cursor: pointer; }

  /* ── Header ─────────────────────────────────────────────── */
  header.top {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
  .brand span { color: var(--text-faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .stat {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-dim); white-space: nowrap;
  }
  .stat b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    transition: background .15s, border-color .15s;
  }
  .icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* Phones: the stat row must not be what decides the page width. */
  @media (max-width: 760px) {
    header.top { flex-wrap: wrap; gap: 8px 12px; padding: 10px 12px; }
    .brand span { display: none; }
    #themeBtn { margin-left: auto; }
    .stats {
      order: 3; width: 100%; margin-left: 0;
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    }
    .stats::-webkit-scrollbar { display: none; }
  }

  /* ── App shell ──────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: minmax(0,1fr) 396px;
    height: calc(100vh - 57px);
  }
  @media (max-width: 1024px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  }
  .app > * { min-width: 0; }

  /* ── Canvas ─────────────────────────────────────────────── */
  .canvas {
    position: relative;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg-canvas);
    overflow: hidden;
    min-height: 0;
  }
  @media (max-width: 1024px) { .canvas { height: 62vh; min-height: 420px; } }
  svg#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  svg#graph.dragging { cursor: grabbing; }

  .toolbar {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    max-width: calc(100% - 24px);
  }
  .tool {
    padding: 6px 11px; border-radius: 8px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim);
    transition: all .15s;
  }
  .tool:hover { color: var(--text); border-color: var(--border-strong); }
  .tool.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .tool-group { display: flex; gap: 4px; padding: 4px; border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(8px); border: 1px solid var(--border); }
  .tool-group .tool { background: none; border: none; padding: 4px 9px; }

  .legend {
    position: absolute; bottom: 12px; left: 12px; z-index: 10;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    padding: 8px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim);
    max-width: calc(100% - 24px);
  }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .ln { display: inline-block; width: 18px; height: 0; border-top: 2px solid currentColor; margin-right: 5px; vertical-align: 3px; }
  .legend button { background: none; border: none; padding: 0; font: inherit; color: inherit; }
  .legend button:hover { color: var(--text); text-decoration: underline; }
  @media (max-width: 720px) { .legend { display: none; } }

  .hint-chip {
    position: absolute; top: 12px; right: 12px; z-index: 12;
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px 8px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border); box-shadow: var(--shadow);
    font-size: 11.5px; color: var(--text-dim); max-width: min(320px, calc(100% - 24px));
    line-height: 1.45;
  }
  .hint-chip b { color: var(--text); font-weight: 600; }
  .hint-chip button { background: none; border: none; color: var(--text-faint); font-size: 15px; line-height: 1; padding: 0 2px; }
  .hint-chip button:hover { color: var(--text); }
  .hint-chip[hidden] { display: none; }
  @media (max-width: 760px) {
    .hint-chip { top: auto; bottom: 12px; left: 12px; right: 12px; max-width: none; }
    .canvas { height: 52vh; min-height: 340px; }
  }

  /* ── SVG styling ────────────────────────────────────────── */
  .layer-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .layer-sub { font-size: 10.5px; }
  .group-title { font-size: 10px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; fill: var(--text-faint); }

  .node { cursor: pointer; }
  .node rect.box {
    fill: var(--node-bg);
    stroke: var(--border-strong);
    stroke-width: 1;
    transition: stroke-width .12s, filter .12s;
  }
  .node:hover rect.box { stroke-width: 2; }
  .node text.label { fill: var(--text); font-size: 11.5px; font-weight: 560; pointer-events: none; }
  .node text.meta  { fill: var(--text-faint); font-size: 9.5px; pointer-events: none; }
  .node rect.accent { stroke: none; }

  .edge { fill: none; stroke-width: 1.2; opacity: .32; transition: opacity .15s, stroke-width .15s; }
  .edge.fk { stroke-dasharray: 2 3; opacity: .26; }
  .edge.policy { stroke-dasharray: 5 3; }
  .edge.scheduled { stroke-dasharray: 7 4; }
  .edge-label { font-size: 9.5px; fill: var(--text-dim); opacity: 0; pointer-events: none; }

  /* focus / dim states */
  /* level of detail: the secondary line is noise once the map is zoomed out */
  #viewport.far .node text.meta { display: none; }
  #viewport.far .group-title { display: none; }

  #viewport.has-focus .node:not(.on) rect.box { opacity: .18; }
  #viewport.has-focus .node:not(.on) text { opacity: .2; }
  #viewport.has-focus .edge:not(.on) { opacity: .05; }
  #viewport.has-focus .group-title, #viewport.has-focus .layer-head { opacity: .35; }

  .edge.on { opacity: 1; stroke-width: 2.4; }
  .edge.on + .edge-label, .edge-label.on { opacity: 1; }
  .node.on rect.box { stroke-width: 2.2; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 45%, transparent)); }
  .node.sel rect.box { stroke: var(--accent); stroke-width: 2.6; }

  .flow-link { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 6 5; opacity: .9;
    animation: dash 1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -22; } }

  .step-badge circle { fill: var(--accent); }
  .step-badge text { fill: #041018; font-size: 10px; font-weight: 750; text-anchor: middle; }
  :root[data-theme="light"] .step-badge text { fill: #fff; }

  /* ── Tooltip ────────────────────────────────────────────── */
  #tip {
    position: fixed; z-index: 100; max-width: 340px;
    padding: 11px 13px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--border-strong);
    box-shadow: var(--shadow);
    pointer-events: none; opacity: 0; transform: translateY(4px);
    transition: opacity .12s, transform .12s;
  }
  #tip.show { opacity: 1; transform: translateY(0); }
  #tip .t-top { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  #tip .t-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  #tip .t-name { font-size: 13px; font-weight: 650; }
  #tip .t-tech { font-size: 11px; color: var(--accent); margin-bottom: 6px; }
  #tip .t-desc { font-size: 12px; color: var(--text-dim); line-height: 1.45; }
  #tip .t-file {
    margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border);
    font: 400 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-faint);
    word-break: break-all;
  }

  /* ── Panel ──────────────────────────────────────────────── */
  .panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  @media (max-width: 1024px) { .panel { border-left: none; border-top: 1px solid var(--border); } }

  .panel-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  .tabs { display: flex; gap: 4px; padding: 3px; background: var(--panel-2); border-radius: 9px; margin-bottom: 10px; }
  .tab {
    flex: 1; padding: 6px 10px; border: none; border-radius: 7px; background: none;
    font-size: 12.5px; font-weight: 560; color: var(--text-dim); transition: all .15s;
  }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .search {
    width: 100%; padding: 8px 11px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--text-faint); }

  .panel-body { flex: 1; overflow-y: auto; padding: 10px 12px 28px; min-height: 0; }
  @media (max-width: 1024px) { .panel-body { max-height: none; overflow: visible; } }
  .panel-body::-webkit-scrollbar { width: 9px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 9px; }

  .cat-head {
    font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--text-faint); padding: 12px 6px 6px;
  }
  .flow {
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel-2); margin-bottom: 7px; overflow: hidden;
    transition: border-color .15s, background .15s;
  }
  .flow:hover { border-color: var(--border-strong); }
  .flow.open { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel-2)); }
  .flow-btn {
    display: flex; align-items: flex-start; gap: 9px; width: 100%;
    padding: 10px 11px; border: none; background: none; text-align: left;
  }
  .flow-idx {
    flex: none; width: 20px; height: 20px; border-radius: 6px; margin-top: 1px;
    background: var(--panel); border: 1px solid var(--border);
    font-size: 10.5px; font-weight: 700; color: var(--text-faint);
    display: grid; place-items: center; font-variant-numeric: tabular-nums;
  }
  .flow.open .flow-idx { background: var(--accent); border-color: var(--accent); color: #041018; }
  :root[data-theme="light"] .flow.open .flow-idx { color: #fff; }
  .flow-name { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .flow-sum { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }
  .flow-count { font-size: 10.5px; color: var(--text-faint); margin-top: 5px; }

  .steps { display: none; padding: 2px 11px 12px 40px; }
  .flow.open .steps { display: block; }
  .step {
    position: relative; padding: 7px 0 7px 16px; cursor: pointer;
    border-left: 1.5px solid var(--border-strong);
  }
  .step:last-child { border-left-color: transparent; }
  .step::before {
    content: ''; position: absolute; left: -5.5px; top: 13px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--panel-2); border: 2px solid var(--accent);
  }
  .step:hover { background: var(--accent-soft); border-radius: 0 6px 6px 0; }
  .step-n { font-size: 12px; font-weight: 600; }
  .step-n em { font-style: normal; color: var(--text-faint); font-weight: 500; font-size: 10.5px; margin-left: 6px; }
  .step-a { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; line-height: 1.45; }

  /* component list */
  .comp {
    display: flex; align-items: flex-start; gap: 9px; width: 100%;
    padding: 9px 10px; margin-bottom: 4px;
    border: 1px solid transparent; border-radius: 9px; background: none; text-align: left;
    transition: background .12s, border-color .12s;
  }
  .comp:hover { background: var(--panel-2); border-color: var(--border); }
  .comp.sel { background: var(--accent-soft); border-color: var(--accent); }
  .comp-dot { flex: none; width: 8px; height: 8px; border-radius: 3px; margin-top: 5px; }
  .comp-name { font-size: 12.5px; font-weight: 570; }
  .comp-file { font: 400 10px/1.4 ui-monospace, Menlo, monospace; color: var(--text-faint); margin-top: 2px; word-break: break-all; }

  .detail { padding: 4px 6px 20px; }
  .detail h3 { margin: 0 0 3px; font-size: 15px; font-weight: 650; }
  .detail .d-tech { font-size: 11.5px; color: var(--accent); margin-bottom: 9px; }
  .detail .d-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; }
  .detail .d-file { margin: 10px 0; padding: 8px 10px; border-radius: 8px; background: var(--panel-2);
    font: 400 11px/1.45 ui-monospace, Menlo, monospace; color: var(--text-dim); word-break: break-all; }
  .detail h4 { margin: 16px 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text-faint); }
  .rel { display: block; width: 100%; padding: 6px 9px; margin-bottom: 3px; text-align: left;
    border: 1px solid var(--border); border-radius: 7px; background: var(--panel-2); font-size: 11.5px; }
  .rel:hover { border-color: var(--accent); }
  .rel span { color: var(--text-faint); font-size: 10.5px; }
  .back { margin-bottom: 10px; padding: 5px 10px; border-radius: 7px; background: var(--panel-2);
    border: 1px solid var(--border); font-size: 11.5px; color: var(--text-dim); }
  .empty { padding: 30px 14px; text-align: center; color: var(--text-faint); font-size: 12.5px; }
  .hint { margin: 10px 0 0; padding: 9px 11px; border-radius: 8px; background: var(--panel-2);
    border: 1px solid var(--border); font-size: 11.5px; color: var(--text-dim); line-height: 1.5; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>App Finanzas</h1>
    <span id="subtitle"></span>
  </div>
  <div class="stats" id="stats"></div>
  <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
</header>

<div class="app">
  <section class="canvas">
    <div class="toolbar">
      <div class="tool-group">
        <button class="tool" data-zoom="in"  title="Acercar (+)">+</button>
        <button class="tool" data-zoom="out" title="Alejar (−)">−</button>
        <button class="tool" data-zoom="fit" title="Ajustar (0)">Ajustar</button>
      </div>
      <button class="tool" id="clearBtn" title="Quitar el resaltado (Esc)">Limpiar</button>
      <button class="tool" id="fkBtn" title="Mostrar/ocultar las claves foráneas entre tablas">Relaciones FK</button>
    </div>
    <div class="hint-chip" id="hint">
      <span>Elige un <b>flujo</b> a la derecha para resaltar su ruta completa. Rueda para acercar, arrastra para mover, clic en un nodo para ver su ficha.</span>
      <button id="hintClose" aria-label="Cerrar aviso">×</button>
    </div>
    <svg id="graph"><g id="viewport"></g></svg>
    <div class="legend" id="legend"></div>
  </section>

  <aside class="panel">
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabFlows" aria-selected="true">Flujos</button>
        <button class="tab" role="tab" id="tabComps" aria-selected="false">Componentes</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Buscar flujo o componente…" autocomplete="off">
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

ard/recurring/actions.ts","tech":"'use server' (~23 KB)","description":"CRUD de plantillas, activar/desactivar y posteo manual. El posteo enruta a create_transfer_transaction o a create_manual_transaction según la forma de la plantilla, y rechaza el auto-posteo de transferencias multimoneda."},{"id":"act-installments","label":"installments/actions.ts","type":"action","layer":"actions","group":"write","file":"src/app/dashboard/installments/actions.ts","tech":"'use server'","description":"Crea un plan de cuotas (plan + N hijas en una sola sentencia, con el resto de redondeo absorbido por la última) y lo cancela anulando solo las cuotas aún no vencidas."},{"id":"act-categories","label":"categories/actions.ts","type":"action","layer":"actions","group":"catalog-actions","file":"src/app/dashboard/categories/actions.ts","tech":"'use server' (~21 KB)","description":"Crear, editar y archivar categorías, promover una subcategoría (BR-047) y moveCategoryAction, que escribe parent_category_id y el sort_order de los hermanos destino a la vez revalidando todas las reglas de parentesco."},{"id":"act-payees","label":"payees/actions.ts","type":"action","layer":"actions","group":"catalog-actions","file":"src/app/dashboard/payees/actions.ts","tech":"'use server'","description":"CRUD de beneficiarios y fusión individual y masiva, que reasigna las transacciones antes de archivar el origen."},{"id":"act-tags","label":"tags/actions.ts","type":"action","layer":"actions","group":"catalog-actions","file":"src/app/dashboard/tags/actions.ts","tech":"'use server'","description":"CRUD de etiquetas con color, y archivado con deshacer en lugar de borrado."},{"id":"act-notes","label":"notes/actions.ts","type":"action","layer":"actions","group":"catalog-actions","file":"src/app/dashboard/notes/actions.ts","tech":"'use server'","description":"Crear, editar y archivar notas fechadas. Escritura directa por PostgREST: no hay dinero implicado, así que no hay RPC."},{"id":"act-budgets","label":"budgets/actions.ts","type":"action","layer":"actions","group":"plan-actions","file":"src/app/dashboard/budgets/actions.ts","tech":"'use server'","description":"Crear el presupuesto del mes, alta/edición y borrado de líneas y copia desde el mes anterior. Toda la aritmética queda en las funciones SQL."},{"id":"act-goals","label":"goals/actions.ts","type":"action","layer":"actions","group":"plan-actions","file":"src/app/dashboard/goals/actions.ts","tech":"'use server'","description":"CRUD de metas y apply_goal_adjustment, que registra el aporte o el retiro como un movimiento real del libro mayor."},{"id":"act-debts","label":"debts/actions.ts","type":"action","layer":"actions","group":"plan-actions","file":"src/app/dashboard/debts/actions.ts","tech":"'use server'","description":"create_debt_with_account crea deuda y cuenta espejo de forma atómica; create_debt_payment reparte el pago entre capital e intereses y mueve el dinero desde la cuenta pagadora."},{"id":"act-rules","label":"rules/actions.ts","type":"action","layer":"actions","group":"plan-actions","file":"src/app/dashboard/rules/actions.ts","tech":"'use server'","description":"CRUD y reordenamiento de las reglas de categorización. La evaluación no vive aquí, sino en lib/rules/match.ts."},{"id":"act-settings","label":"Acciones de sistema","type":"action","layer":"actions","group":"system-actions","file":"src/app/dashboard/settings/settings-actions.ts","tech":"'use server'","description":"Perfil, contraseña, email, hogar, preferencias de UI y cierre de sesión global; más session-actions.ts, lib/i18n/actions.ts (cambio de idioma) y lib/accounts-view/actions.ts (modo de vista de cuentas)."},{"id":"act-quick","label":"Acciones rápidas y de lectura","type":"action","layer":"actions","group":"system-actions","file":"src/app/dashboard/quick-create-actions.ts","tech":"'use server'","description":"quickCreateCategory / quickCreateAccount / quickCreateTag desde dentro del formulario, getQuickAddFormData para precargar el diálogo global, trend-actions.ts para las series y month-review/actions.ts para el cierre."},{"id":"act-assistant","label":"assistant/actions.ts","type":"action","layer":"actions","group":"system-actions","file":"src/app/dashboard/assistant/actions.ts","tech":"'use server'","description":"Bucle de conversación con herramientas (máx. 6 rondas, 20 mensajes de historial) y extracción de un borrador de transacción desde voz o recibo. El householdId lo resuelve el servidor: el modelo nunca lo aporta."},{"id":"lib-analysis-server","label":"analysis/server.ts","type":"lib","layer":"lib","group":"analysis-lib","file":"src/lib/analysis/server.ts","tech":"'server-only'","description":"getHousehold() — resuelve sesión, perfil y hogar o redirige — más las utilidades de mes y los envoltorios de los RPC de resumen. Lee month_start_day en una consulta aparte para que una migración sin aplicar degrade una pantalla y no tumbe todas."},{"id":"lib-report-query","label":"analysis/report-query.ts","type":"lib","layer":"lib","group":"analysis-lib","file":"src/lib/analysis/report-query.ts","tech":"TypeScript (~24 KB)","description":"fetchFilteredRows es la fuente única de Reportes y Calendario, así que ambos coinciden por construcción. Incluye getReportData, getCalendarMonth y fetchTransferExpenseRows (BR-039), que lee la pata de entrada de la transferencia y la emite como gasto sin asignación."},{"id":"lib-periods","label":"periods/month.ts","type":"lib","layer":"lib","group":"analysis-lib","file":"src/lib/periods/month.ts","tech":"Función pura","description":"Resolutor único del día de inicio de mes (BR-036). Un periodo YYYY-MM empieza en month_start_day y termina el día antes del siguiente: derivar el fin del siguiente inicio es lo que hace el día 1 idéntico a hoy y seguro el clamp del día 31 en febrero."},{"id":"lib-cards","label":"cards/cycle.ts","type":"lib","layer":"lib","group":"analysis-lib","file":"src/lib/cards/cycle.ts","tech":"Función pura","description":"Ventanas de corte y pago de tarjeta (BR-030). Duplica a propósito la aritmética que también está en SQL: el SQL calcula junto al dinero, y este helper alimenta la vista previa en el alta, cuando aún no hay cuenta que leer."},{"id":"lib-format","label":"format · calc · currencies · fx","type":"lib","layer":"lib","group":"money-lib","file":"src/lib/format.ts","tech":"Funciones puras","description":"Formateo de dinero y fechas sensible al locale, todayIsoDateLocal (el día del calendario del usuario, no UTC), aritmética de importes, catálogo de monedas activas y resolución de tipos de cambio."},{"id":"lib-domain-shared","label":"Helpers de dominio","type":"lib","layer":"lib","group":"money-lib","file":"src/lib/recurring/shared.ts","tech":"Funciones puras compartidas","description":"recurring/shared (cadencias y próxima ejecución), goals/shared, installments/shared, health/score (score de salud financiera), accounts-view/group, categories/style, account-display y glossary."},{"id":"lib-rules","label":"rules/match.ts","type":"lib","layer":"lib","group":"pipeline-lib","file":"src/lib/rules/match.ts","tech":"Función pura","description":"Motor de reglas (BR-010): campos description/merchant_name/amount/account_name, operadores contains/equals/starts_with/ends_with/regex/gt/lt. Gana la primera regla que casa por prioridad ascendente."},{"id":"lib-imports","label":"imports/*","type":"lib","layer":"lib","group":"pipeline-lib","file":"src/lib/imports/csv-validation.ts","tech":"Parser + validación","description":"csv-parser (tolerante a comillas y separadores), csv-validation (marca cada fila válida/inválida/duplicada con errores y avisos) y los tipos del mapeo, los presets y el historial de lotes."},{"id":"lib-exports","label":"exports/csv · exports/xlsx","type":"lib","layer":"lib","group":"pipeline-lib","file":"src/lib/exports/xlsx.ts","tech":"node:zlib","description":"Serializa la misma tabla de columnas/filas a CSV o a XLSX. El escritor de XLSX está hecho a mano sobre node:zlib en vez de añadir una dependencia; un patrón decimal estricto convierte los numéricos-como-texto de Postgres en celdas numéricas reales."},{"id":"lib-ai","label":"ai/client · prompts · tools","type":"lib","layer":"lib","group":"pipeline-lib","file":"src/lib/ai/tools.ts","tech":"@anthropic-ai/sdk","description":"Cliente perezoso (la API key solo hace falta si se usa el asistente), prompts de análisis y de extracción, y cinco herramientas de solo lectura. Cada ejecutor acota su consulta al householdId del servidor y los RPC subyacentes vuelven a exigir pertenencia vía RLS."},{"id":"lib-i18n","label":"i18n/*","type":"lib","layer":"lib","group":"platform-lib","file":"src/lib/i18n/ui.ts","tech":"Catálogo propio","description":"dictionaries.ts (claves tipadas), legacy-ui-translations.ts (~190 KB de literales auditados), translateUi con coincidencia exacta y por plantilla {1}, server.ts (cookie af_locale) y los nombres de categorías del sistema. Inglés, español y francés canadiense."},{"id":"lib-preferences","label":"preferences/*","type":"lib","layer":"lib","group":"platform-lib","file":"src/lib/preferences/shared.ts","tech":"JSONB tipado","description":"Lee y normaliza profiles.ui_preferences: qué campos opcionales muestra el formulario de alta (BR-032) y cómo abre y renderiza la lista de transacciones (BR-038)."},{"id":"lib-nav","label":"nav/config.ts","type":"lib","layer":"lib","group":"platform-lib","file":"src/lib/nav/config.ts","tech":"Configuración declarativa","description":"Fuente única de la navegación: seis grupos, cada item con href, clave de traducción, icono, fase (alpha/beta/soon/pro) y una pista en lenguaje llano. La usan sidebar, barra móvil y la página de coming-soon."},{"id":"lib-errors","label":"supabase/errors.ts","type":"lib","layer":"lib","group":"platform-lib","file":"src/lib/supabase/errors.ts","tech":"Saneado de errores","description":"Filtra los mensajes de Postgres antes de mostrarlos: descarta los que casan patrones internos (PGRST, SQLSTATE, nombres de columnas, RLS, constraints) o superan 180 caracteres, y devuelve un texto genérico."},{"id":"sb-server","label":"createClient (servidor)","type":"client-lib","layer":"data","group":"clients","file":"src/lib/supabase/server.ts","tech":"@supabase/ssr","description":"Cliente por request construido sobre next/headers cookies(). Tolera el fallo de escritura de cookies en Server Components porque el middleware ya se encarga del refresco."},{"id":"sb-browser","label":"createClient (navegador)","type":"client-lib","layer":"data","group":"clients","file":"src/lib/supabase/client.ts","tech":"@supabase/ssr","description":"Cliente de navegador para lo poco que necesita sesión en cliente. Usa la clave publishable; ninguna escritura de dinero pasa por aquí."},{"id":"sb-auth","label":"Supabase Auth","type":"service","layer":"data","group":"clients","file":"auth.users","tech":"GoTrue + PKCE","description":"Sesiones en cookie, email/contraseña y OAuth con Google. El trigger handle_new_user siembra la fila de profiles al registrarse."},{"id":"postgrest","label":"PostgREST","type":"gateway","layer":"data","group":"gateway","file":"supabase","tech":"REST sobre Postgres","description":"Traduce .from().select() y .rpc() a SQL. Es el único camino de la app a la base: no hay conexión directa ni ORM."},{"id":"rls","label":"Row Level Security","type":"policy","layer":"data","group":"gateway","file":"supabase/migrations/*","tech":"Políticas por tabla","description":"Cada tabla exige pertenencia al household para leer y rol de editor o superior para escribir, vía is_household_member / is_household_editor / is_household_admin. Las pocas funciones security definer que la eluden están documentadas y restringidas."},{"id":"rpc-txn-write","label":"create/update/void_transaction","type":"rpc","layer":"rpc","group":"rpc-ledger","file":"supabase/migrations/20260601185356_update_manual_transaction_rpc.sql","tech":"plpgsql","description":"create_manual_transaction, update_manual_transaction, void_transaction y unvoid_transaction. Escriben la cabecera, las entradas de cuenta y las asignaciones de categoría en una sola transacción; anular no borra, marca."},{"id":"rpc-transfer","label":"create/update_transfer_transaction","type":"rpc","layer":"rpc","group":"rpc-ledger","file":"supabase/migrations/20260723140000_br_007_cross_currency_transfers.sql","tech":"plpgsql","description":"Dos entradas que se compensan en moneda base. En transferencias multimoneda (BR-007) el usuario aporta los dos importes reales y el diferencial se registra como coste de cambio. Una sobrecarga vieja tuvo que eliminarse con DROP explícito."},{"id":"rpc-refund","label":"create_refund_transaction","type":"rpc","layer":"rpc","group":"rpc-ledger","file":"supabase/migrations/20260730160000_br_040_refunds.sql","tech":"plpgsql","description":"Reembolso como importe negativo en la categoría original (BR-040): entrada positiva — para que nunca fabrique un saldo negativo — y asignación negativa. Las CHECK se estrecharon en vez de eliminarse: solo se permite negativo en allocation_type='expense'. Rechaza reembolsar más de lo que queda."},{"id":"rpc-balances","label":"get_account_balances · opening · adjustment","type":"rpc","layer":"rpc","group":"rpc-ledger","file":"supabase/migrations/20260601000500_account_balances_function.sql","tech":"plpgsql","description":"get_account_balances deriva posteado/pendiente/proyectado desde transaction_entries a una fecha, excluyendo cuentas archivadas (BR-004). create_opening_balance y create_balance_adjustment (BR-017) escriben el asiento correspondiente."},{"id":"rpc-installments","label":"create/cancel_installment_plan","type":"rpc","layer":"rpc","group":"rpc-ledger","file":"supabase/migrations/20260730150000_br_035_installment_plans.sql","tech":"plpgsql","description":"Escribe el plan y sus N cuotas en una sola sentencia, con la última absorbiendo el resto para que la suma cuadre exacta. Cancelar anula solo las cuotas aún no vencidas."},{"id":"rpc-search","label":"search_household_transactions","type":"rpc","layer":"rpc","group":"rpc-read","file":"supabase/migrations/20260729120000_multi_value_transaction_filters.sql","tech":"plpgsql, RETURNS TABLE","description":"Búsqueda paginada con filtros de rango, texto, cuentas, categorías, etiquetas y arrays p_types/p_statuses/p_payee_ids. Ordena por fecha, luego transaction_time desc nulls last y luego created_at, para que un día sin horas ordene igual que antes."},{"id":"rpc-dashboard","label":"get_monthly_dashboard_summary · by_category","type":"rpc","layer":"rpc","group":"rpc-read","file":"supabase/migrations/20260601161728_create_monthly_dashboard_functions.sql","tech":"plpgsql","description":"Ingreso, gasto, ahorro y tasa de ahorro del mes, y el desglose de gasto por categoría con conteos. Respetan exclude_from_reports y filtran solo por transaction_date."},{"id":"rpc-budget","label":"Funciones de presupuesto","type":"rpc","layer":"rpc","group":"rpc-read","file":"supabase/migrations/20260729140000_br_043_budget_comparison_split.sql","tech":"plpgsql","description":"create_monthly_budget, upsert/delete_budget_line, copy_budget_from_previous_month, get_monthly_budget_details, get_budget_line_carryovers (BR-018), get_budget_previous_actuals y get_budget_payment_split. Las dos últimas copian literalmente el predicado de reales de get_monthly_budget_details para que nunca discrepen."},{"id":"rpc-cards","label":"get_card_cycle_summaries","type":"rpc","layer":"rpc","group":"rpc-read","file":"supabase/migrations/20260730140000_br_030_card_statement_cycle.sql","tech":"plpgsql","description":"Por tarjeta: payable, outstanding, statement_balance, paid_since_close e is_overdue, en positivo-como-deuda. payable excluye outstanding y jamás se suman en pantalla. Es plural y con alcance de household porque la lista pinta todas las tarjetas a la vez."},{"id":"rpc-csv","label":"create_csv_import · revert_csv_import","type":"rpc","layer":"rpc","group":"rpc-domain","file":"supabase/migrations/20260722130000_br_024_csv_import_presets_revert.sql","tech":"plpgsql","description":"Crea el lote, sus filas y todas las transacciones válidas de forma atómica; revert_csv_import deshace un lote entero dejando constancia del número revertido."},{"id":"rpc-payees","label":"Funciones de beneficiarios","type":"rpc","layer":"rpc","group":"rpc-domain","file":"supabase/migrations/20260717120000_br_009_payee_crud.sql","tech":"plpgsql","description":"get_or_create_payee (idempotente por nombre normalizado), get_payees_with_stats, merge_payees y merge_payees_bulk."},{"id":"rpc-tags","label":"set_transaction_tags · get_tags_with_stats","type":"rpc","layer":"rpc","group":"rpc-domain","file":"supabase/migrations/20260722120000_br_023_tags.sql","tech":"plpgsql","description":"Reemplaza el conjunto completo de etiquetas de una transacción (no hace diff incremental) y devuelve las etiquetas con su conteo de uso."},{"id":"rpc-debts","label":"Funciones de deuda","type":"rpc","layer":"rpc","group":"rpc-domain","file":"supabase/migrations/20260602000600_sprint_10_debts_net_worth.sql","tech":"plpgsql","description":"create_debt_with_account (deuda + cuenta espejo en una operación), update_debt_metadata y create_debt_payment, que separa capital de intereses y mueve el dinero desde la cuenta pagadora."},{"id":"rpc-goals","label":"apply_goal_adjustment","type":"rpc","layer":"rpc","group":"rpc-domain","file":"supabase/migrations/20260618000100_create_goals.sql","tech":"plpgsql","description":"Registra un aporte o retiro de una meta como movimiento real del libro mayor, de forma que el progreso siempre esté respaldado por dinero de verdad."},{"id":"rpc-recurring","label":"run_recurring_autopost","type":"rpc","layer":"rpc","group":"rpc-domain","file":"supabase/migrations/20260723150000_br_014_recurring_autopost.sql","tech":"plpgsql, security definer","description":"Recorre las plantillas vencidas con auto_post, crea el movimiento o la transferencia, avanza next_run_date y registra éxito o fallo. Elude RLS y postea sobre todo el household, así que solo el planificador y los admin pueden invocarla."},{"id":"rpc-fx","label":"get_exchange_rate","type":"rpc","layer":"rpc","group":"rpc-system","file":"supabase/migrations/20260613000100_br_001_csv_import_fx.sql","tech":"plpgsql","description":"Resuelve el tipo de cambio aplicable a una fecha desde exchange_rates, con vuelta a 1 cuando la moneda coincide con la base."},{"id":"rpc-guards","label":"Guardas y triggers","type":"rpc","layer":"rpc","group":"rpc-system","file":"supabase/migrations/20260531000100_identity_household.sql","tech":"plpgsql, security definer","description":"is_household_member/editor/admin/creator y has_household_role (los predicados de RLS), assert_expense_category, handle_new_user, set_updated_at y create_default_categories_for_household."},{"id":"rpc-admin","label":"copy_household_data","type":"rpc","layer":"rpc","group":"rpc-system","file":"supabase/migrations/20260622110000_copy_household_data.sql","tech":"plpgsql, security definer","description":"Utilidad solo para el editor SQL: replica los datos de un household en otro para hacer QA con datos reales copiados. Deliberadamente sin interfaz en la app."},{"id":"tbl-profiles","label":"profiles","type":"table","layer":"db","group":"db-identity","file":"supabase/migrations/20260531000100_identity_household.sql","tech":"1:1 con auth.users","description":"default_household_id (el hogar activo), display_name, email, locale (canónico frente a la cookie af_locale) y ui_preferences jsonb (BR-032/038)."},{"id":"tbl-households","label":"households","type":"table","layer":"db","group":"db-identity","file":"supabase/migrations/20260531000100_identity_household.sql","tech":"Raíz del tenant","description":"name, base_currency y month_start_day (BR-036, por defecto 1). Todo dato financiero cuelga de aquí; el borrado en cascada limpia el hogar entero."},{"id":"tbl-members","label":"household_members","type":"table","layer":"db","group":"db-identity","file":"supabase/migrations/
