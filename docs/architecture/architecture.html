flow-auth","name":"Acceso con email y contraseña","category":"Identidad","summary":"Desde el formulario de login hasta el panel, pasando por el refresco de cookie del middleware y la restauración del idioma guardado.","steps":[{"node":"browser","action":"El usuario abre la app; la ruta raíz decide a dónde ir."},{"node":"proxy","action":"El middleware intercepta la request (matcher excluye estáticos)."},{"node":"update-session","action":"Crea un cliente SSR sobre las cookies y llama a auth.getUser()."},{"node":"route-home","action":"Sin sesión, redirige a /login."},{"node":"route-login","action":"Formulario de email/contraseña."},{"node":"act-login","action":"Server Action: valida y llama a signInWithPassword."},{"node":"sb-auth","action":"Emite la sesión y fija las cookies."},{"node":"lib-i18n","action":"Restaura la cookie af_locale desde profiles.locale."},{"node":"route-dashboard","action":"Redirección al panel ya autenticado."}]},{"id":"flow-oauth","name":"Acceso con Google (OAuth + PKCE)","category":"Identidad","summary":"El code de Google se canjea por sesión en un route handler que además decide entre onboarding y panel, y recupera el idioma.","steps":[{"node":"route-login","action":"El usuario pulsa 'Continuar con Google'."},{"node":"act-login","action":"signInWithOAuth genera la URL de autorización."},{"node":"ext-google","action":"El usuario autoriza y Google redirige con ?code=."},{"node":"route-auth-callback","action":"GET /auth/callback recibe el code; si falta, vuelve a /login con error."},{"node":"sb-auth","action":"exchangeCodeForSession canjea el code por una sesión en cookie."},{"node":"sb-server","action":"Lee profiles.default_household_id y profiles.locale."},{"node":"route-onboarding","action":"Sin hogar, entra al alta guiada."},{"node":"route-dashboard","action":"Con hogar, va al panel con la cookie de idioma ya restaurada."}]},{"id":"flow-onboarding","name":"Alta de hogar (onboarding)","category":"Identidad","summary":"Cuatro pasos, cada uno con su ruta, que terminan creando el household, la membresía owner, las categorías por defecto y la primera cuenta.","steps":[{"node":"route-onboarding","action":"Bienvenida → paso 'hogar': nombre y moneda base."},{"node":"act-onboarding","action":"createHouseholdAction valida la moneda contra la tabla currencies."},{"node":"lib-format","action":"isActiveCurrency comprueba que la moneda esté activa."},{"node":"sb-server","action":"Upsert de profiles, insert de households e insert de household_members con rol owner."},{"node":"tbl-households","action":"Nace el tenant: todo dato financiero colgará de esta fila."},{"node":"rpc-guards","action":"create_default_categories_for_household siembra el árbol inicial."},{"node":"tbl-categories","action":"Categorías por defecto listas para usar."},{"node":"tbl-profiles","action":"Se fija default_household_id — sin esto, la app rebota a /onboarding."},{"node":"act-accounts","action":"Paso 'cuenta': primera cuenta con su saldo inicial."},{"node":"route-dashboard","action":"Paso 'listo' y entrada al panel."}]},{"id":"flow-txn-create","name":"Alta de transacción manual","category":"Libro mayor","summary":"El camino de escritura canónico: formulario → Server Action con Zod → RPC atómico que escribe cabecera, asiento y asignaciones → etiquetas → revalidate.","steps":[{"node":"txn-dialog-provider","action":"El FAB abre el diálogo global con cuentas, categorías y beneficiarios ya precargados."},{"node":"txn-form","action":"El usuario elige tipo, importe, fecha (chips relativos), categoría y campos opcionales según sus preferencias."},{"node":"act-transactions","action":"createManualTransactionAction parsea el FormData y lo valida con Zod."},{"node":"lib-format","action":"Normaliza el importe y resuelve el día local del usuario, no UTC."},{"node":"rpc-payees","action":"get_or_create_payee resuelve el beneficiario por nombre normalizado."},{"node":"rpc-txn-write","action":"create_manual_transaction escribe todo en una sola transacción de base de datos."},{"node":"rpc-fx","action":"Si la cuenta no está en moneda base, resuelve el tipo de cambio de la fecha."},{"node":"tbl-transactions","action":"Cabecera: tipo, estado posted, origen manual, fecha y hora opcional."},{"node":"tbl-entries","action":"Asiento de la cuenta pagadora, con importe en moneda de cuenta y en base."},{"node":"tbl-allocations","action":"Una asignación por categoría — varias si el usuario dividió el gasto."},{"node":"rpc-tags","action":"set_transaction_tags reemplaza el conjunto completo de etiquetas."},{"node":"lib-errors","action":"Si Postgres falla, el mensaje se sanea antes de mostrarlo."},{"node":"route-transactions","action":"revalidatePath refresca la lista y los saldos afectados."}]},{"id":"flow-txn-transfer","name":"Transferencia entre cuentas (incl. multimoneda)","category":"Libro mayor","summary":"Dos asientos que se compensan en moneda base. En cruces de moneda el usuario aporta los dos importes reales y el diferencial se registra como coste de cambio.","steps":[{"node":"txn-form","action":"Tipo 'transferencia': la tarjeta de montos pone cada importe justo encima de su cuenta (BR-031)."},{"node":"act-transactions","action":"createTransferTransactionAction valida que origen y destino difieran."},{"node":"rpc-transfer","action":"create_transfer_transaction escribe cabecera y las dos patas de forma atómica."},{"node":"rpc-fx","action":"En cruce de moneda, resuelve la tasa; el diferencial se contabiliza como coste (BR-007)."},{"node":"tbl-transactions","action":"Una sola cabecera de tipo transfer."},{"node":"tbl-entries","action":"Dos asientos: salida negativa en origen, entrada positiva en destino, que suman ~0 en base."},{"node":"tbl-accounts","action":"Si la cuenta destino tiene treat_transfers_as_expense, los reportes la verán como gasto (BR-039)."},{"node":"route-transactions","action":"La transferencia aparece como una fila con sus dos patas."}]},{"id":"flow-txn-refund","name":"Reembolso como importe negativo","category":"Libro mayor","summary":"BR-040: el reembolso es un gasto negativo en la categoría original, así que toda superficie de reporte lo neteda sin cambiar una sola línea de SQL compartido.","steps":[{"node":"txn-filters","action":"Desde la fila del gasto original, la acción 'Reembolsar'."},{"node":"act-transactions","action":"createRefundTransactionAction valida importe y transacción de origen."},{"node":"rpc-refund","action":"create_refund_transaction rechaza reembolsar más de lo que queda pendiente."},{"node":"tbl-transactions","action":"Nueva cabecera de tipo refund enlazada al gasto original."},{"node":"tbl-entries","action":"Entrada positiva en la cuenta: un reembolso nunca puede fabricar un saldo negativo."},{"node":"tbl-allocations","action":"Asignación negativa en la categoría original. Las CHECK se estrecharon: solo se permite negativo en allocation_type='expense'."},{"node":"rpc-dashboard","action":"El panel y los reportes ya suman amount_base_currency, así que el neteo es automático."},{"node":"sql-tests","action":"br_040_refund_invariants.sql verifica que la invariante allocation_actuals ≤ entry_movements se mantiene."}]},{"id":"flow-txn-search","name":"Lista de transacciones con filtros de servidor","category":"Libro mayor","summary":"BR-008: los filtros viven en la URL, la paginación y el filtrado ocurren en SQL y la pantalla nunca trae más filas de las que muestra.","steps":[{"node":"txn-filters","action":"La barra de filtros envía por GET: tipo multi-toggle, estado, beneficiarios, etiquetas, rango y texto."},{"node":"route-transactions","action":"Traduce los searchParams a argumentos tipados; los presets de fecha solo preparan From/To, no navegan."},{"node":"lib-preferences","action":"ui_preferences aporta el periodo y la cuenta por defecto y la densidad de fila (BR-038)."},{"node":"rpc-search","action":"search_household_transactions filtra y pagina con arrays p_types/p_statuses/p_payee_ids."},{"node":"tbl-transactions","action":"Ordena por fecha, luego transaction_time desc nulls last, luego created_at."},{"node":"tbl-entries","action":"Aporta la cuenta y el signo de cada fila."},{"node":"tbl-allocations","action":"Aporta la categoría (o marca la fila como dividida)."},{"node":"txn-filters","action":"Se renderizan las filas con sus acciones: editar, copiar, anular, reembolsar."}]},{"id":"flow-txn-void","name":"Anular y restaurar una transacción","category":"Libro mayor","summary":"Nada se borra: anular marca voided_at y restaurar lo revierte, de modo que el histórico siempre es auditable.","steps":[{"node":"txn-filters","action":"Acción 'Anular' con motivo opcional en la fila."},{"node":"act-transactions","action":"voidTransactionAction / unvoidTransactionAction."},{"node":"rpc-txn-write","action":"void_transaction marca la cabecera; unvoid_transaction la devuelve a posted."},{"node":"tbl-transactions","action":"voided_at, voided_by y void_reason; el estado pasa a 'voided'."},{"node":"rpc-balances","action":"Los saldos dejan de contar los asientos de una transacción anulada."},{"node":"route-transactions","action":"La fila sigue visible, marcada como anulada y todavía copiable."}]},{"id":"flow-csv-import","name":"Importación CSV con reglas de categorización","category":"Automatización","summary":"Mapear columnas, previsualizar fila a fila con validación y sugerencia automática de categoría, y confirmar el lote entero en una operación atómica.","steps":[{"node":"route-import","action":"Carga cuentas, categorías, monedas, presets guardados e historial de lotes."},{"node":"csv-import-client","action":"El usuario sube el archivo y mapea columnas, o recupera un preset (BR-024)."},{"node":"lib-imports","action":"csv-parser lee el archivo; csv-validation marca cada fila como válida, inválida o duplicada."},{"node":"lib-rules","action":"El motor de reglas sugiere categoría: gana la primera regla que casa por prioridad ascendente."},{"node":"act-import","action":"createCsvImportAction envía solo las filas válidas."},{"node":"rpc-payees","action":"get_or_create_payee resuelve cada comercio sin duplicar."},{"node":"rpc-csv","action":"create_csv_import escribe lote, filas y transacciones en una sola operación."},{"node":"tbl-imports","action":"El lote guarda el dato crudo junto al mapeado, que es lo que hace posible revertir."},{"node":"tbl-transactions","action":"Las transacciones nacen con source='csv_import'."},{"node":"route-transactions","action":"Redirección a la lista con el lote recién importado."}]},{"id":"flow-csv-revert","name":"Revertir un lote importado","category":"Automatización","summary":"Un CSV mal mapeado se deshace entero desde el historial, sin tener que anular fila por fila.","steps":[{"node":"route-import","action":"Sección de historial con los lotes y su estado."},{"node":"act-import","action":"revertCsvImportAction con el id del lote."},{"node":"rpc-csv","action":"revert_csv_import elimina las transacciones del lote y anota cuántas revirtió."},{"node":"tbl-imports","action":"El lote queda marcado como revertido con su contador."},{"node":"tbl-transactions","action":"Las transacciones del lote desaparecen del libro mayor."},{"node":"rpc-balances","action":"Los saldos se recalculan solos: nunca hubo un total materializado que corregir."}]},{"id":"flow-recurring-autopost","name":"Auto-posteo de recurrentes (pg_cron)","category":"Automatización","summary":"El único camino de escritura que no nace de una acción del usuario: un job diario en la base de datos postea las plantillas vencidas y deja bitácora.","steps":[{"node":"pg-cron","action":"Job 'recurring-autopost' a las 06:00 UTC llama a run_recurring_autopost()."},{"node":"rpc-recurring","action":"security definer: elude RLS y recorre las plantillas vencidas con auto_post de todos los hogares."},{"node":"tbl-recurring","action":"Selecciona las que tienen next_run_date vencida y están activas."},{"node":"rpc-txn-write","action":"Rama de movimiento: crea el ingreso o gasto de la plantilla."},{"node":"rpc-transfer","action":"Rama de transferencia (UC-9): dos asientos a la tasa del origen. Las transferencias multimoneda se marcan y se saltan."},{"node":"tbl-transactions","action":"Las transacciones nacen con source='system'."},{"node":"tbl-autopost-log","action":"Una fila por intento, con el motivo si falló."},{"node":"route-recurring","action":"La pantalla muestra una alerta agregada de salud construida sobre esa bitácora."}]},{"id":"flow-recurring-manual","name":"Postear una recurrente a mano","category":"Automatización","summary":"El mismo destino que el job, pero iniciado por el usuario y con RLS activo — incluidas las transferencias multimoneda, que solo se pueden postear así.","steps":[{"node":"route-recurring","action":"Botón 'Postear ahora' en la fila de la plantilla."},{"node":"act-recurring","action":"postRecurringAction enruta según la forma de la plantilla."},{"node":"rpc-transfer","action":"Con to_account_id: create_transfer_transaction — es la vía para las multimoneda, que el job no puede hacer."},{"node":"rpc-txn-write","action":"Sin to_account_id: create_manual_transaction con la categoría de la plantilla."},{"node":"tbl-recurring","action":"Se avanza next_run_date según la cadencia."},{"node":"route-transactions","action":"La transacción ya aparece en la lista."}]},{"id":"flow-installments","name":"Compra en cuotas","category":"Planificación","summary":"BR-035: el plan no guarda dinero. Todo el valor está en N transacciones hijas, así que ningún reporte puede contar dos veces padre e hijas.","steps":[{"node":"route-installments","action":"Alta del plan: total, número de cuotas, primera fecha, cuenta y categoría."},{"node":"act-installments","action":"Valida y llama al RPC; el cálculo del reparto no ocurre en el cliente."},{"node":"rpc-installments","action":"create_installment_plan escribe plan y cuotas en una sola sentencia; la última absorbe el resto de redondeo."},{"node":"tbl-installments","action":"El plan: total, N, fecha de inicio y estado. Sin asientos ni asignaciones."},{"node":"tbl-transactions","action":"N gastos de total/N enlazados por installment_plan_id + installment_number."},{"node":"tbl-allocations","action":"Cada cuota lleva su asignación de categoría, así que entra sola en presupuestos y reportes."},{"node":"rpc-cards","action":"Una cuota futura cae después del corte, así que cuenta como outstanding y nunca como payable."}]},{"id":"flow-budget","name":"Presupuesto mensual","category":"Planificación","summary":"Planificado contra real por categoría, con arrastre del sobrante, comparación con el mes anterior y reparto por medio de pago.","steps":[{"node":"route-budgets","action":"Selección de mes; si no existe presupuesto, ofrece crearlo o copiar el anterior."},{"node":"act-budgets","action":"create_monthly_budget / copy_budget_from_previous_month / upsert_budget_line."},{"node":"rpc-budget","action":"get_monthly_budget_details calcula planificado, real y desviación por línea."},{"node":"tbl-budgets","action":"Un presupuesto por hogar y mes, con una línea por categoría."},{"node":"tbl-allocations","action":"Los reales salen de aquí, con el mismo predicado que copian las funciones auxiliares."},{"node":"rpc-budget","action":"get_budget_line_carryovers arrastra el sobrante (BR-018); get_budget_previous_actuals compara like-for-like con el mes anterior."},{"node":"tbl-entries","action":"get_budget_payment_split atribuye cada transacción al asiento más negativo — la cuenta que pagó — y reparte en efectivo/tarjeta/otro (BR-043)."},{"node":"route-budgets","action":"Los buckets del reparto son exhaustivos y suman exactamente el total gastado."}]},{"id":"flow-dashboard","name":"Carga del panel mensual","category":"Análisis","summary":"Una sola pantalla que combina cuatro RPC en paralelo, dos meses de datos y el score de salud, todo resuelto en servidor antes del primer pintado.","steps":[{"node":"route-dashboard","action":"Server Component: lee el mes de los searchParams o toma el actual."},{"node":"lib-analysis-server","action":"getHousehold resuelve sesión, perfil y hogar, o redirige a login/onboarding."},{"node":"tbl-profiles","action":"default_household_id decide qué hogar se está mirando."},{"node":"rpc-dashboard","action":"Resumen del mes y del anterior, más el desglose de gasto por categoría."},{"node":"rpc-balances","action":"Saldos por cuenta a fecha para el hero financiero."},{"node":"rpc-budget","action":"Estado del presupuesto en curso, si existe."},{"node":"lib-domain-shared","action":"health/score calcula el indicador de salud financiera."},{"node":"charts","action":"CategoryDonut y KPIs reciben los datos ya agregados: el cliente no calcula dinero."}]},{"id":"flow-reports","name":"Reportes con periodo configurable","category":"Análisis","summary":"La única pantalla que respeta households.month_start_day (BR-036), con filas semanales ISO y transferencias-como-gasto opcionales.","steps":[{"node":"route-reports","action":"Filtros de rango, cuentas, categorías, etiquetas y beneficiarios en la URL."},{"node":"lib-periods","action":"Un periodo YYYY-MM empieza en month_start_day y acaba el día antes del siguiente inicio — así el día 1 es idéntico a hoy y el 31 hace clamp sin romper febrero."},{"node":"lib-report-query","action":"fetchFilteredRows es la fuente única; getReportData agrega por categoría."},{"node":"tbl-allocations","action":"El desglose por categoría sale de aquí."},{"node":"tbl-entries","action":"fetchTransferExpenseRows lee la pata de entrada de la transferencia (BR-039)."},{"node":"tbl-accounts","action":"Solo cuentas con treat_transfers_as_expense; la fila resultante no tiene asignación, así que llega a los KPI pero nunca al desglose."},{"node":"route-reports","action":"Filas semanales ISO recortadas al rango (BR-042), que particionan el periodo exactamente."},{"node":"charts","action":"Se pinta el desglose; la pantalla declara que presupuestos y cierres siguen usando el mes de calendario."}]},{"id":"flow-calendar","name":"Calendario mensual de gasto","category":"Análisis","summary":"BR-037: rejilla con inicio en lunes que comparte con Reportes exactamente la misma consulta, así que las dos pantallas no pueden discrepar.","steps":[{"node":"route-calendar","action":"Mes seleccionado y navegación anterior/siguiente."},{"node":"lib-report-query","action":"getCalendarMonth reutiliza fetchFilteredRows, la misma que usa Reportes."},{"node":"tbl-allocations","action":"Ingreso, gasto y neto por día."},{"node":"route-calendar","action":"Los días vacíos se pintan como celdas en cero, no se omiten."},{"node":"route-transactions","action":"Cada día activo enlaza a la lista filtrada por esa fecha."}]},{"id":"flow-card-cycle","name":"Ciclo de estado de cuenta de tarjeta","category":"Análisis","summary":"BR-030 rebanada 1: se muestra qué hay que pagar y qué está aún por cortar, sin mezclar nunca ambas cifras. La acción 'Pagar' es deliberadamente otra rebanada.","steps":[{"node":"route-accounts","action":"Las cuentas de tipo tarjeta muestran su tarjeta de ciclo."},{"node":"rpc-cards","action":"get_card_cycle_summaries devuelve todas las tarjetas del hogar de una vez, no una por llamada."},{"node":"tbl-accounts","action":"statement_day y payment_day: ambos o ninguno, y solo en credit_card/debt."},{"node":"tbl-entries","action":"Los movimientos del ciclo, en positivo-como-deuda."},{"node":"route-accounts","action":"payable excluye outstanding y las dos cifras jamás se suman en pantalla; is_overdue marca el retraso."},{"node":"lib-cards","action":"El mismo cálculo existe en TypeScript para la vista previa en el alta, cuando aún no hay cuenta que leer."}]},{"id":"flow-networth","name":"Patrimonio neto y deudas","category":"Análisis","summary":"Activos menos pasivos derivados enteramente de los asientos; una deuda es una cuenta espejo, no un campo aparte que pueda desincronizarse.","steps":[{"node":"route-debts","action":"Alta de la deuda: principal, tasa, cuota y día de pago."},{"node":"act-debts","action":"createDebtAction llama al RPC que crea deuda y cuenta a la vez."},{"node":"rpc-debts","action":"create_debt_with_account: sin operación atómica se podría quedar una deuda sin cuenta."},{"node":"tbl-debts","action":"Metadatos del préstamo."},{"node":"tbl-accounts","action":"Cuenta espejo de tipo deuda que aporta el pasivo al patrimonio."},{"node":"rpc-debts","action":"create_debt_payment reparte el pago entre capital e intereses."},{"node":"rpc-balances","action":"get_account_balances deriva el saldo de cada cuenta desde los asientos, excluyendo archivadas."},{"node":"route-net-worth","action":"Activos menos pasivos por tipo, con su evolución mensual."},{"node":"route-debt-planner","action":"El simulador avalancha/bola de nieve proyecta sobre esos saldos reales sin escribir nada."}]},{"id":"flow-goals","name":"Metas de ahorro","category":"Planificación","summary":"El progreso de una meta nunca se guarda como número: se deriva de movimientos reales, para que no pueda mentir.","steps":[{"node":"route-goals","action":"Alta de la meta: objetivo, fecha y cuenta asociada."},{"node":"act-goals","action":"Registro de un aporte o un retiro."},{"node":"rpc-goals","action":"apply_goal_adjustment escribe el movimiento en el libro mayor."},{"node":"tbl-transactions","action":"El aporte es una transacción real, no un contador."},{"node":"tbl-goals","action":"La meta solo guarda el objetivo; el progreso se calcula."},{"node":"route-goals","action":"Barra de progreso y ritmo necesario para llegar a la fecha."}]},{"id":"flow-assistant-chat","name":"Asistente IA: pregunta con herramientas","category":"IA","summary":"Bucle de hasta seis rondas de herramientas de solo lectura. El householdId lo pone el servidor: el modelo no puede pedir datos de otro hogar.","steps":[{"node":"assistant-drawer","action":"El usuario escribe una pregunta sobre sus finanzas."},{"node":"act-assistant","action":"Resuelve la sesión y el hogar, y recorta el historial a 20 mensajes."},{"node":"lib-ai","action":"buildAnalysisSystemPrompt inyecta moneda base y fecha de hoy, y exige llamar a una herramienta antes de dar cifras."},{"node":"ext-anthropic","action":"messages.create con las cinco herramientas declaradas."},{"node":"lib-ai","action":"El ejecutor de la herramienta acota la consulta al householdId del servidor."},{"node":"rpc-dashboard","action":"Herramientas de resumen mensual y desglose por categoría."},{"node":"rpc-balances","action":"Herramienta de saldos por cuenta."},{"node":"rpc-search","action":"Herramienta de búsqueda de transacciones para el detalle."},{"node":"rls","action":"Segunda barrera: los RPC vuelven a exigir pertenencia al hogar."},{"node":"assistant-drawer","action":"La respuesta llega en el idioma del usuario, con la cifra primero."}]},{"id":"flow-assistant-draft","name":"Captura por voz o recibo con IA","category":"IA","summary":"El modelo extrae un borrador estructurado, pero nunca escribe: el borrador cae en el formulario y el usuario confirma.","steps":[{"node":"voice-composer","action":"Nota de voz transcrita o foto de recibo."},{"node":"act-assistant","action":"Carga las categorías del hogar para acotar la elección del modelo."},{"node":"lib-ai","action":"buildTransactionDraftSystemPrompt lista los ids de categoría y prohíbe inventar datos que no estén en la entrada."},{"node":"ext-anthropic","action":"El modelo llama a record_transaction_draft con tipo, importe, fecha, comercio y categoría sugerida."},{"node":"txn-form","action":"El borrador precarga el formulario, con la nota de confianza si el modelo dudó."},{"node":"act-transactions","action":"Solo al confirmar el usuario se ejecuta la escritura normal."},{"node":"rpc-txn-write","action":"A partir de aquí es exactamente el flujo de alta manual."}]},{"id":"flow-export","name":"Exportar a CSV o XLSX","category":"Operaciones","summary":"BR-041: la misma tabla de columnas y filas se serializa de dos formas; el XLSX está escrito a mano sobre node:zlib en vez de añadir una dependencia.","steps":[{"node":"route-export","action":"El usuario elige el conjunto de datos y el formato."},{"node":"route-export-download","action":"Route handler GET con los parámetros de la exportación."},{"node":"sb-server","action":"Lee el conjunto pedido con RLS activo: solo salen datos del hogar."},{"node":"lib-exports","action":"Se construye una tabla de columnas/filas, independiente del formato."},{"node":"lib-format","action":"Un patrón decimal estricto promueve los numéricos-como-texto de Postgres a celdas numéricas reales; last_four se declara texto a propósito."},{"node":"browser","action":"El archivo se devuelve con Content-Disposition; nunca pasa por el estado del cliente."}]},{"id":"flow-i18n","name":"Idioma y preferencias de UI","category":"Operaciones","summary":"profiles.locale es la fuente canónica y la cookie af_locale es solo su caché; por eso el idioma sobrevive a un login OAuth en otro dispositivo.","steps":[{"node":"route-settings","action":"El usuario cambia idioma o preferencias de campos y de lista."},{"node":"act-settings","action":"updateUiPreferencesAction y la acción de idioma escriben en profiles."},{"node":"tbl-profiles","action":"locale y ui_preferences jsonb — canónicos, no la cookie."},{"node":"lib-i18n","action":"Se fija la cookie af_locale; server.ts la lee en cada render."},{"node":"root-layout","action":"getLocale() decide <html lang> antes del primer pintado."},{"node":"providers","action":"LanguageProvider y LocalizedClientBoundary traducen también los componentes cliente."},{"node":"lib-preferences","action":"ui_preferences decide qué campos opcionales muestra el formulario y cómo abre la lista."},{"node":"scripts-i18n","action":"npm run i18n:check falla si alguna frase visible se queda sin traducir."}]},{"id":"flow-balance-adjust","name":"Saldo inicial y ajuste de saldo","category":"Libro mayor","summary":"Como no existe un campo balance, corregir un saldo significa escribir un asiento que explique la diferencia.","steps":[{"node":"route-accounts","action":"Formulario de saldo inicial o de ajuste sobre la cuenta."},{"node":"act-accounts","action":"setOpeningBalanceAction / adjustBalanceAction validan importe y fecha."},{"node":"rpc-balances","action":"create_opening_balance o create_balance_adjustment (BR-017) escriben el asiento."},{"node":"tbl-transactions","action":"Cabecera de tipo opening_balance o adjustment."},{"node":"tbl-entries","action":"El asiento que hace cuadrar la cuenta con la realidad."},{"node":"rpc-balances","action":"get_account_balances vuelve a derivar el saldo: no hay total materializado que corregir."},{"node":"route-accounts","action":"La cuenta muestra el saldo nuevo y el ajuste queda visible en el histórico."}]},{"id":"flow-catalogs","name":"Catálogos: categorías, beneficiarios, etiquetas y notas","category":"Operaciones","summary":"Los cuatro comparten una política: archivar en vez de borrar, con deshacer, para que ninguna transacción quede huérfana.","steps":[{"node":"route-categories","action":"Árbol de dos niveles por tipo; el arrastre reordena y anida."},{"node":"dnd-lists","action":"projectDrop lee el desplazamiento horizontal para la profundidad, limitada a los dos niveles del esquema."},{"node":"act-categories","action":"moveCategoryAction escribe parent_category_id y el sort_order de los hermanos a la vez; un drop inválido devuelve mensaje y la fila vuelve a su sitio."},{"node":"tbl-categories","action":"Jerarquía, color, icono, orden y exclude_from_reports."},{"node":"act-payees","action":"Fusión de beneficiarios: reasigna las transacciones antes de archivar el origen."},{"node":"rpc-payees","action":"merge_payees_bulk hace la fusión masiva en una operación."},{"node":"act-tags","action":"Etiquetas con color, transversales a las categorías."},{"node":"act-notes","action":"Notas fechadas, fuera del libro mayor y sin referencias cruzadas con transacciones."},{"node":"providers","action":"ArchiveToast ofrece deshacer inmediatamente tras archivar."}]},{"id":"flow-security","name":"Aislamiento por hogar (RLS de punta a punta)","category":"Seguridad","summary":"Cuatro barreras encadenadas, cada una suficiente por sí sola, que hacen imposible que un usuario vea datos de otro hogar.","steps":[{"node":"proxy","action":"El middleware refresca la sesión; sin cookie válida no hay usuario que pasar."},{"node":"route-dashboard","action":"Toda ruta autenticada resuelve el hogar en servidor y redirige si no lo hay."},{"node":"lib-analysis-server","action":"getHousehold lee default_household_id del perfil: el hogar nunca viene de la URL ni del cliente."},{"node":"sb-server","action":"El cliente se construye con las cookies del usuario; no existe una service key en el runtime de la app."},{"node":"postgrest","action":"Toda consulta entra como el rol authenticated con el JWT del usuario."},{"node":"rls","action":"Cada tabla exige pertenencia para leer y rol de editor o superior para escribir."},{"node":"rpc-guards","action":"is_household_member / is_household_editor resuelven el rol contra household_members."},{"node":"tbl-members","action":"La tabla de roles es el único árbitro de qué puede hacer cada usuario."},{"node":"lib-errors","action":"Si algo falla, el mensaje se sanea: nada de PGRST, SQLSTATE ni nombres de columnas hacia el usuario."}]}]}</script>
<script>
(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('graph-data').textContent);
  const { meta, layers, groups, nodes, edges, flows } = DATA;

  const NODE_W = 232, NODE_H = 48, NODE_GAP = 12, GROUP_GAP = 30;
  const COL_GAP = 78, COL_W = NODE_W + COL_GAP, PAD = 56, TOP = 118;

  const byId = new Map(nodes.map(n => [n.id, n]));
  const layerById = new Map(layers.map(l => [l.id, l]));
  const layerColor = id => `var(--l-${id})`;

  /* ── Layout ──────────────────────────────────────────────── */
  const ordered = [...layers].sort((a, b) => a.order - b.order);
  let maxY = 0;
  ordered.forEach((layer, ci) => {
    const x = PAD + ci * COL_W;
    layer.x = x;
    let y = TOP;
    const layerGroups = groups.filter(g => g.layer === layer.id);
    layerGroups.forEach(g => {
      const members = nodes.filter(n => n.group === g.id);
      if (!members.length) return;
      g.x = x; g.y = y;
      y += 20;
      members.forEach(n => { n.x = x; n.y = y; n.w = NODE_W; n.h = NODE_H; y += NODE_H + NODE_GAP; });
      y += GROUP_GAP - NODE_GAP;
    });
    layer.h = y;
    maxY = Math.max(maxY, y);
  });
  const W = PAD * 2 + ordered.length * COL_W - COL_GAP;
  const H = maxY + PAD;

  /* ── SVG scaffolding ─────────────────────────────────────── */
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const svg = document.getElementById('graph');
  const vp = document.getElementById('viewport');

  const defs = el('defs', {}, svg);
  [['a-dim', 'var(--text-faint)', .5], ['a-on', 'var(--accent)', 1]].forEach(([id, color, op]) => {
    const m = el('marker', { id, viewBox: '0 0 8 8', refX: 7, refY: 4,
      markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M0,0 L8,4 L0,8 z', fill: color, opacity: op }, m);
  });

  const gEdges  = el('g', { id: 'edges' }, vp);
  const gFlow   = el('g', { id: 'flowlinks' }, vp);
  const gNodes  = el('g', { id: 'nodes' }, vp);
  const gBadges = el('g', { id: 'badges' }, vp);   // above the nodes, or the step numbers hide under them
  const gDeco   = el('g', { id: 'deco' }, vp);

  /* layer + group headings */
  ordered.forEach(layer => {
    const g = el('g', { class: 'layer-head' }, gDeco);
    el('rect', { x: layer.x, y: 46, width: NODE_W, height: 3, rx: 2,
      fill: layerColor(layer.id), opacity: .85 }, g);
    const t = el('text', { x: layer.x, y: 74, class: 'layer-title', fill: layerColor(layer.id) }, g);
    t.textContent = layer.label;
    const s = el('text', { x: layer.x, y: 90, class: 'layer-sub', fill: 'var(--text-faint)' }, g);
    s.textContent = nodes.filter(n => n.layer === layer.id).length + ' componentes';
  });
  groups.forEach(g => {
    if (g.x === undefined) return;
    const t = el('text', { x: g.x + 2, y: g.y + 11, class: 'group-title' }, gDeco);
    t.textContent = g.label;
  });

  /* ── Edges ───────────────────────────────────────────────── */
  const edgePath = (s, t) => {
    const sy = s.y + s.h / 2, ty = t.y + t.h / 2;
    if (t.x > s.x) {
      const x1 = s.x + s.w, x2 = t.x, dx = Math.max(46, (x2 - x1) * .55);
      return `M${x1},${sy} C${x1 + dx},${sy} ${x2 - dx},${ty} ${x2},${ty}`;
    }
    if (t.x < s.x) {
      const x1 = s.x, x2 = t.x + t.w, dx = Math.max(46, (x1 - x2) * .55);
      return `M${x1},${sy} C${x1 - dx},${sy} ${x2 + dx},${ty} ${x2},${ty}`;
    }
    const x1 = s.x + s.w, bulge = 34 + Math.min(70, Math.abs(ty - sy) * .28);
    return `M${x1},${sy} C${x1 + bulge},${sy} ${x1 + bulge},${ty} ${x1},${ty}`;
  };

  const edgeEls = [];
  edges.forEach((e, i) => {
    const s = byId.get(e.source), t = byId.get(e.target);
    if (!s || !t) return;
    const d = edgePath(s, t);
    const p = el('path', {
      class: 'edge ' + (e.kind || 'call'),
      d, stroke: layerColor(t.layer),
      'marker-end': 'url(#a-dim)'
    }, gEdges);
    const lbl = el('text', { class: 'edge-label' }, gEdges);
    const mid = { x: (s.x + s.w + t.x) / 2, y: (s.y + t.y) / 2 + NODE_H / 2 - 6 };
    lbl.setAttribute('x', mid.x); lbl.setAttribute('y', mid.y);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.textContent = e.label || '';
    e._p = p; e._l = lbl; e._i = i;
    edgeEls.push(e);
  });

  /* ── Nodes ───────────────────────────────────────────────── */
  const wrap = (text, max, lines) => {
    const words = String(text).split(/\s+/);
    const out = []; let cur = '';
    for (const w of words) {
      const next = cur ? cur + ' ' + w : w;
      if (next.length <= max) { cur = next; continue; }
      if (cur) out.push(cur);
      cur = w.length > max ? w.slice(0, max - 1) + '…' : w;
      if (out.length === lines) break;
    }
    if (cur && out.length < lines) out.push(cur);
    if (out.length === lines && words.join(' ').length > out.join(' ').length + 1) {
      out[lines - 1] = out[lines - 1].slice(0, max - 1).replace(/[\s·]+$/, '') + '…';
    }
    return out;
  };

  nodes.forEach(n => {
    const g = el('g', { class: 'node', 'data-id': n.id, tabindex: '0', role: 'button' }, gNodes);
    el('rect', { class: 'box', x: n.x, y: n.y, width: n.w, height: n.h, rx: 9,
      stroke: layerColor(n.layer) }, g);
    el('rect', { class: 'accent', x: n.x, y: n.y + 9, width: 3, height: n.h - 18, rx: 1.5,
      fill: layerColor(n.layer) }, g);

    const lines = wrap(n.label, 29, 2);
    const hasMeta = !!n.tech && lines.length === 1;
    const baseY = lines.length === 1 ? (hasMeta ? n.y + 21 : n.y + 28) : n.y + 20;
    lines.forEach((ln, i) => {
      const t = el('text', { class: 'label', x: n.x + 13, y: baseY + i * 14 }, g);
      t.textContent = ln;
    });
    if (hasMeta) {
      const m = el('text', { class: 'meta', x: n.x + 13, y: n.y + 35 }, g);
      m.textContent = wrap(n.tech, 34, 1)[0] || '';
    }
    n._g = g;
  });

  /* ── Pan & zoom ──────────────────────────────────────────── */
  let scale = 1, tx = 0, ty = 0;
  const applyView = () => {
    vp.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
    vp.classList.toggle('far', scale < 0.62);
  };
  const viewBox = () => svg.getBoundingClientRect();

  function fitTo(box, maxScale = 1.05, padding = 70, minScale = 0.12) {
    const r = viewBox();
    const pad = Math.min(padding, r.width * 0.08, r.height * 0.08);
    const s = Math.min((r.width - pad * 2) / box.w, (r.height - pad * 2) / box.h);
    scale = Math.max(minScale, Math.min(maxScale, s));
    tx = r.width / 2 - (box.x + box.w / 2) * scale;
    ty = r.height / 2 - (box.y + box.h / 2) * scale;
    applyView();
  }
  const fitAll = () => fitTo({ x: 0, y: 0, w: W, h: H }, 1);

  function zoomBy(f, cx, cy) {
    const r = viewBox();
    cx = cx ?? r.width / 2; cy = cy ?? r.height / 2;
    const ns = Math.max(0.12, Math.min(2.6, scale * f));
    tx = cx - (cx - tx) * (ns / scale);
    ty = cy - (cy - ty) * (ns / scale);
    scale = ns; applyView();
  }

  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = viewBox();
    zoomBy(Math.exp(-ev.deltaY * 0.0016), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });

  let drag = null;
  svg.addEventListener('pointerdown', ev => {
    if (ev.target.closest('.node')) return;
    drag = { x: ev.clientX, y: ev.clientY, tx, ty };
    svg.classList.add('dragging'); svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev => {
    if (!drag) return;
    tx = drag.tx + (ev.clientX - drag.x);
    ty = drag.ty + (ev.clientY - drag.y);
    applyView();
  });
  const endDrag = () => { drag = null; svg.classList.remove('dragging'); };
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.zoom;
    if (k === 'fit') fitAll(); else zoomBy(k === 'in' ? 1.28 : 1 / 1.28);
  }));

  /* ── Tooltip ─────────────────────────────────────────────── */
  const tip = document.getElementById('tip');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function showTip(n, ev) {
    tip.innerHTML =
      `<div class="t-top"><span class="t-dot" style="background:${layerColor(n.layer)}"></span>` +
      `<span class="t-name">${esc(n.label)}</span></div>` +
      (n.tech ? `<div class="t-tech">${esc(n.tech)}</div>` : '') +
      `<div class="t-desc">${esc(n.description)}</div>` +
      (n.file && n.file !== '—' ? `<div class="t-file">${esc(n.file)}</div>` : '');
    tip.classList.add('show');
    moveTip(ev);
  }
  function moveTip(ev) {
    const r = tip.getBoundingClientRect();
    let x = ev.clientX + 16, y = ev.clientY + 16;
    if (x + r.width > innerWidth - 10) x = ev.clientX - r.width - 16;
    if (y + r.height > innerHeight - 10) y = Math.max(10, ev.clientY - r.height - 16);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  const hideTip = () => tip.classList.remove('show');

  /* ── Focus / highlight engine ────────────────────────────── */
  let activeFlow = null, activeNode = null;

  function clearFocus() {
    vp.classList.remove('has-focus');
    gFlow.textContent = '';
    gBadges.textContent = '';
    nodes.forEach(n => n._g.classList.remove('on', 'sel'));
    edgeEls.forEach(e => { e._p.classList.remove('on'); e._l.classList.remove('on');
      e._p.setAttribute('marker-end', 'url(#a-dim)'); });
  }

  function focusNode(id, { center = false } = {}) {
    activeFlow = null; activeNode = id;
    clearFocus();
    const n = byId.get(id); if (!n) return;
    vp.classList.add('has-focus');
    n._g.classList.add('on', 'sel');
    edgeEls.forEach(e => {
      if (e.source !== id && e.target !== id) return;
      e._p.classList.add('on'); e._l.classList.add('on');
      e._p.setAttribute('marker-end', 'url(#a-on)');
      e._p.setAttribute('stroke', 'var(--accent)');
      byId.get(e.source === id ? e.target : e.source)?._g.classList.add('on');
    });
    if (center) {
      const b = { x: n.x - 300, y: n.y - 200, w: n.w + 600, h: n.h + 400 };
      fitTo(b, 1.05, 40);
    }
    renderDetail(n);
    document.querySelectorAll('.comp').forEach(c =>
      c.classList.toggle('sel', c.dataset.id === id));
  }

  const edgeKey = new Map();
  edgeEls.forEach(e => { edgeKey.set(e.source + '>' + e.target, e); });

  function focusFlow(flow) {
    activeNode = null; activeFlow = flow.id;
    clearFocus();
    vp.classList.add('has-focus');

    const seen = new Set();
    flow.steps.forEach((s, i) => {
      const n = byId.get(s.node); if (!n) return;
      n._g.classList.add('on');
      if (!seen.has(n.id)) {
        seen.add(n.id);
        const b = el('g', { class: 'step-badge' }, gBadges);
        el('circle', { cx: n.x + n.w - 11, cy: n.y + 11, r: 9 }, b);
        const t = el('text', { x: n.x + n.w - 11, y: n.y + 14.5 }, b);
        t.textContent = i + 1;
      }
    });

    for (let i = 0; i < flow.steps.length - 1; i++) {
      const a = byId.get(flow.steps[i].node), b = byId.get(flow.steps[i + 1].node);
      if (!a || !b || a === b) continue;
      const e = edgeKey.get(a.id + '>' + b.id) || edgeKey.get(b.id + '>' + a.id);
      if (e) {
        e._p.classList.add('on'); e._l.classList.add('on');
        e._p.setAttribute('stroke', 'var(--accent)');
        e._p.setAttribute('marker-end', 'url(#a-on)');
      } else {
        el('path', { class: 'flow-link', d: edgePath(a, b), 'marker-end': 'url(#a-on)' }, gFlow);
      }
    }

    const xs = flow.steps.map(s => byId.get(s.node)).filter(Boolean);
    if (xs.length) {
      const x0 = Math.min(...xs.map(n => n.x)), x1 = Math.max(...xs.map(n => n.x + n.w));
      const y0 = Math.min(...xs.map(n => n.y)), y1 = Math.max(...xs.map(n => n.y + n.h));
      // On a narrow canvas a whole flow fits only at an unreadable zoom, so we
      // stop at 0.34 and let the step list drive navigation instead.
      fitTo({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 }, 1.0, 90, 0.34);
    }
  }

  /* ── Node interactions ───────────────────────────────────── */
  gNodes.addEventListener('pointerover', ev => {
    const g = ev.target.closest('.node'); if (!g) return;
    showTip(byId.get(g.dataset.id), ev);
  });
  gNodes.addEventListener('pointermove', ev => { if (tip.classList.contains('show')) moveTip(ev); });
  gNodes.addEventListener('pointerout', ev => { if (ev.target.closest('.node')) hideTip(); });
  gNodes.addEventListener('click', ev => {
    const g = ev.target.closest('.node'); if (!g) return;
    setTab('comps');
    focusNode(g.dataset.id);
  });
  gNodes.addEventListener('keydown', ev => {
    const g = ev.target.closest('.node'); if (!g) return;
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); setTab('comps'); focusNode(g.dataset.id); }
  });

  /* ── Panel ───────────────────────────────────────────────── */
  const body = document.getElementById('panelBody');
  const searchEl = document.getElementById('search');
  const tabFlows = document.getElementById('tabFlows');
  const tabComps = document.getElementById('tabComps');
  let tab = 'flows', query = '';

  function setTab(t) {
    if (tab === t) return;
    tab = t;
    tabFlows.setAttribute('aria-selected', String(t === 'flows'));
    tabComps.setAttribute('aria-selected', String(t === 'comps'));
    searchEl.placeholder = t === 'flows' ? 'Buscar flujo…' : 'Buscar componente…';
    render();
  }
  tabFlows.addEventListener('click', () => setTab('flows'));
  tabComps.addEventListener('click', () => { setTab('comps'); });
  searchEl.addEventListener('input', () => { query = searchEl.value.trim().toLowerCase(); render(); });

  const matches = (hay, q) => !q || hay.toLowerCase().includes(q);

  function renderFlows() {
    const cats = [];
    flows.forEach((f, i) => {
      const hay = f.name + ' ' + f.summary + ' ' + f.category + ' ' +
        f.steps.map(s => (byId.get(s.node)?.label || '') + ' ' + s.action).join(' ');
      if (!matches(hay, query)) return;
      let c = cats.find(c => c.name === f.category);
      if (!c) cats.push(c = { name: f.category, items: [] });
      c.items.push({ f, i });
    });
    if (!cats.length) return `<div class="empty">Ningún flujo coincide con “${esc(query)}”.</div>`;

    return cats.map(c => `<div class="cat-head">${esc(c.name)}</div>` + c.items.map(({ f, i }) => {
      const open = activeFlow === f.id;
      return `<div class="flow ${open ? 'open' : ''}" data-flow="${f.id}">
        <button class="flow-btn">
          <span class="flow-idx">${i + 1}</span>
          <span style="min-width:0">
            <span class="flow-name">${esc(f.name)}</span>
            <div class="flow-sum">${esc(f.summary)}</div>
            <div class="flow-count">${f.steps.length} pasos${open ? '' : ' · pulsa para resaltar la ruta'}</div>
          </span>
        </button>
        <div class="steps">${f.steps.map((s, si) => {
          const n = byId.get(s.node);
          return `<div class="step" data-node="${esc(s.node)}">
            <div class="step-n">${si + 1}. ${esc(n ? n.label : s.node)}
              <em>${esc(n ? (layerById.get(n.layer)?.label || '') : '')}</em></div>
            <div class="step-a">${esc(s.action)}</div>
          </div>`;
        }).join('')}</div>
      </div>`;
    }).join('')).join('');
  }

  function renderComps() {
    const out = [];
    ordered.forEach(l => {
      const items = nodes.filter(n => n.layer === l.id &&
        matches(n.label + ' ' + n.description + ' ' + (n.file || '') + ' ' + (n.tech || ''), query));
      if (!items.length) return;
      out.push(`<div class="cat-head" style="color:${layerColor(l.id)}">${esc(l.label)}</div>`);
      items.forEach(n => out.push(
        `<button class="comp ${activeNode === n.id ? 'sel' : ''}" data-id="${n.id}">
          <span class="comp-dot" style="background:${layerColor(n.layer)}"></span>
          <span style="min-width:0">
            <span class="comp-name">${esc(n.label)}</span>
            ${n.file && n.file !== '—' ? `<div class="comp-file">${esc(n.file)}</div>` : ''}
          </span>
        </button>`));
    });
    return out.length ? out.join('') : `<div class="empty">Ningún componente coincide con “${esc(query)}”.</div>`;
  }

  function renderDetail(n) {
    const ins = edges.filter(e => e.target === n.id);
    const outs = edges.filter(e => e.source === n.id);
    const rel = (list, dir) => list.map(e => {
      const o = byId.get(dir === 'out' ? e.target : e.source);
      return `<button class="rel" data-id="${o?.id}">${dir === 'out' ? '→' : '←'} ${esc(o?.label || '')}
        <span>${esc(e.label || '')}</span></button>`;
    }).join('') || '<div class="empty" style="padding:8px 0">—</div>';

    const inFlows = flows.filter(f => f.steps.some(s => s.node === n.id));

    body.innerHTML = `<div class="detail">
      <button class="back" id="backBtn">← Volver a la lista</button>
      <h3>${esc(n.label)}</h3>
      ${n.tech ? `<div class="d-tech">${esc(n.tech)} · ${esc(layerById.get(n.layer)?.label || '')}</div>` : ''}
      <div class="d-desc">${esc(n.description)}</div>
      ${n.file && n.file !== '—' ? `<div class="d-file">${esc(n.file)}</div>` : ''}
      <h4>Depende de (${outs.length})</h4>${rel(outs, 'out')}
      <h4>Usado por (${ins.length})</h4>${rel(ins, 'in')}
      ${inFlows.length ? `<h4>Aparece en ${inFlows.length} flujo${inFlows.length > 1 ? 's' : ''}</h4>` +
        inFlows.map(f => `<button class="rel" data-flow="${f.id}">▸ ${esc(f.name)}</button>`).join('') : ''}
    </div>`;
  }

  function render() {
    body.innerHTML = tab === 'flows' ? renderFlows() : renderComps();
    // Only when the panel is its own scroll container. In the stacked phone
    // layout the page itself scrolls, and this would jump the map off-screen.
    if (tab === 'flows' && activeFlow && innerWidth > 1024) {
      const open = body.querySelector('.flow.open');
      if (open) open.scrollIntoView({ block: 'nearest' });
    }
  }

  body.addEventListener('click', ev => {
    const back = ev.target.closest('#backBtn');
    if (back) { activeNode = null; clearFocus(); render(); return; }

    const relBtn = ev.target.closest('.rel');
    if (relBtn) {
      if (relBtn.dataset.flow) {
        const f = flows.find(x => x.id === relBtn.dataset.flow);
        if (f) { setTab('flows'); activeFlow = f.id; focusFlow(f); render(); }
      } else if (relBtn.dataset.id) focusNode(relBtn.dataset.id, { center: true });
      return;
    }

    const comp = ev.target.closest('.comp');
    if (comp) { focusNode(comp.dataset.id, { center: true }); return; }

    const step = ev.target.closest('.step');
    if (step) {
      const n = byId.get(step.dataset.node);
      if (n) fitTo({ x: n.x - 340, y: n.y - 230, w: n.w + 680, h: n.h + 460 }, 1.05, 40);
      return;
    }

    const card = ev.target.closest('.flow');
    if (card) {
      const f = flows.find(x => x.id === card.dataset.flow);
      if (!f) return;
      if (activeFlow === f.id) { activeFlow = null; clearFocus(); fitAll(); }
      else { activeFlow = f.id; focusFlow(f); }
      render();
    }
  });

  body.addEventListener('pointerover', ev => {
    const step = ev.target.closest('.step'); if (!step) return;
    const n = byId.get(step.dataset.node); if (n) showTip(n, ev);
  });
  body.addEventListener('pointermove', ev => { if (tip.classList.contains('show')) moveTip(ev); });
  body.addEventListener('pointerout', ev => { if (ev.target.closest('.step')) hideTip(); });

  /* ── Toolbar extras ──────────────────────────────────────── */
  document.getElementById('clearBtn').addEventListener('click', () => {
    activeFlow = null; activeNode = null; clearFocus(); fitAll(); render();
  });

  let fkOn = true;
  const fkBtn = document.getElementById('fkBtn');
  fkBtn.classList.add('active');
  fkBtn.addEventListener('click', () => {
    fkOn = !fkOn;
    fkBtn.classList.toggle('active', fkOn);
    edgeEls.forEach(e => { if (e.kind === 'fk') e._p.style.display = fkOn ? '' : 'none'; });
  });

  const themeBtn = document.getElementById('themeBtn');
  const root = document.documentElement;
  const store = (() => { try { return localStorage; } catch { return null; } })();
  const urlTheme = new URLSearchParams(location.search).get('theme');
  const startTheme = urlTheme || store?.getItem('af-arch-theme') ||
    (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  root.setAttribute('data-theme', startTheme === 'light' ? 'light' : 'dark');
  themeBtn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { store?.setItem('af-arch-theme', next); } catch {}
  });

  addEventListener('keydown', ev => {
    if (ev.target.matches('input')) return;
    if (ev.key === 'Escape') { activeFlow = null; activeNode = null; clearFocus(); fitAll(); render(); }
    if (ev.key === '0') fitAll();
    if (ev.key === '+' || ev.key === '=') zoomBy(1.28);
    if (ev.key === '-') zoomBy(1 / 1.28);
  });

  /* ── Header + legend ─────────────────────────────────────── */
  document.getElementById('subtitle').textContent = 'Mapa de arquitectura interactivo';
  const c = meta.counts || {};
  document.getElementById('stats').innerHTML = [
    ['Componentes', nodes.length], ['Conexiones', edges.length], ['Flujos', flows.length],
    ['Tablas', c.tables], ['Funciones SQL', c.sqlFunctions], ['Migraciones', c.migrations]
  ].filter(([, v]) => v != null)
   .map(([k, v]) => `<span class="stat">${k} <b>${v}</b></span>`).join('');

  const legend = document.getElementById('legend');
  legend.innerHTML =
    ordered.map(l => `<button data-layer="${l.id}" title="Ir a la capa ${esc(l.label)}">
      <i style="background:${layerColor(l.id)}"></i>${esc(l.label)}</button>`).join('') +
    `<span style="color:var(--accent)"><span class="ln"></span>ruta del flujo</span>`;
  legend.addEventListener('click', ev => {
    const b = ev.target.closest('[data-layer]'); if (!b) return;
    const l = layerById.get(b.dataset.layer); if (!l) return;
    fitTo({ x: l.x - 30, y: 40, w: NODE_W + 60, h: (l.h || H) - 20 }, 0.9, 40);
  });

  const hint = document.getElementById('hint');
  document.getElementById('hintClose').addEventListener('click', () => { hint.hidden = true; });

  /* ── Deep links (#flow-… / #node-…) ──────────────────────── */
  function syncHash() {
    const h = activeFlow ? '#' + activeFlow : activeNode ? '#node-' + activeNode : '';
    if (location.hash !== h) history.replaceState(null, '', h || location.pathname);
  }
  function applyHash() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!h) return false;
    if (h.startsWith('node-')) {
      const id = h.slice(5);
      if (!byId.has(id)) return false;
      // focusNode paints the detail view itself — re-rendering here would wipe it.
      setTab('comps'); focusNode(id, { center: true }); return true;
    }
    const f = flows.find(x => x.id === h);
    if (!f) return false;
    activeFlow = f.id; focusFlow(f); render();
    return true;
  }

  const _focusFlow = focusFlow, _focusNode = focusNode;
  focusFlow = f => { _focusFlow(f); hint.hidden = true; syncHash(); };
  focusNode = (id, o) => { _focusNode(id, o); hint.hidden = true; syncHash(); };
  const _clearFocus = clearFocus;
  clearFocus = () => { _clearFocus(); if (!activeFlow && !activeNode) syncHash(); };

  /* ── Boot ────────────────────────────────────────────────── */
  render();
  fitAll();
  if (!applyHash()) setTimeout(() => { hint.hidden = false; }, 0);
  addEventListener('hashchange', applyHash);
  addEventListener('resize', () => { if (!activeFlow && !activeNode) fitAll(); });
})();
</script>
</body>
</html>
