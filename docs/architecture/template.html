<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumbo — Mapa de arquitectura</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --bg-canvas: #0d1218;
    --grid: rgba(255,255,255,.035);
    --panel: #111823;
    --panel-2: #0e141d;
    --border: rgba(255,255,255,.10);
    --border-strong: rgba(255,255,255,.20);
    --text: #e8edf4;
    --text-dim: #93a1b4;
    --text-faint: #64748b;
    --accent: #5eb0ff;
    --accent-soft: rgba(94,176,255,.14);
    --node-bg: #172130;
    --node-bg-2: #131c28;
    --shadow: 0 8px 28px rgba(0,0,0,.45);

    --l-client:  #7dd3fc;
    --l-edge:    #a78bfa;
    --l-routes:  #60a5fa;
    --l-actions: #f472b6;
    --l-lib:     #fbbf24;
    --l-data:    #34d399;
    --l-rpc:     #fb923c;
    --l-db:      #4ade80;
    --l-platform:#94a3b8;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f7fa;
    --bg-canvas: #fbfcfe;
    --grid: rgba(15,23,42,.05);
    --panel: #ffffff;
    --panel-2: #f2f5f9;
    --border: rgba(15,23,42,.12);
    --border-strong: rgba(15,23,42,.28);
    --text: #0f1b2d;
    --text-dim: #4a5a70;
    --text-faint: #7b8aa0;
    --accent: #0f6fd1;
    --accent-soft: rgba(15,111,209,.10);
    --node-bg: #ffffff;
    --node-bg-2: #f6f9fc;
    --shadow: 0 6px 20px rgba(15,23,42,.10);

    --l-client:  #0284c7;
    --l-edge:    #7c3aed;
    --l-routes:  #2563eb;
    --l-actions: #db2777;
    --l-lib:     #b45309;
    --l-data:    #047857;
    --l-rpc:     #c2410c;
    --l-db:      #15803d;
    --l-platform:#475569;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  @media (max-width: 1024px) { body { overflow-y: auto; overflow-x: hidden; } }

  button { font: inherit; color: inherit; cursor: pointer; }

  /* ── Header ─────────────────────────────────────────────── */
  header.top {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
  .brand span { color: var(--text-faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .stat {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-dim); white-space: nowrap;
  }
  .stat b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    transition: background .15s, border-color .15s;
  }
  .icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* Phones: the stat row must not be what decides the page width. */
  @media (max-width: 760px) {
    header.top { flex-wrap: wrap; gap: 8px 12px; padding: 10px 12px; }
    .brand span { display: none; }
    #themeBtn { margin-left: auto; }
    .stats {
      order: 3; width: 100%; margin-left: 0;
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    }
    .stats::-webkit-scrollbar { display: none; }
  }

  /* ── App shell ──────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: minmax(0,1fr) 396px;
    height: calc(100vh - 57px);
  }
  @media (max-width: 1024px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  }
  .app > * { min-width: 0; }

  /* ── Canvas ─────────────────────────────────────────────── */
  .canvas {
    position: relative;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg-canvas);
    overflow: hidden;
    min-height: 0;
  }
  @media (max-width: 1024px) { .canvas { height: 62vh; min-height: 420px; } }
  svg#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  svg#graph.dragging { cursor: grabbing; }

  .toolbar {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    max-width: calc(100% - 24px);
  }
  .tool {
    padding: 6px 11px; border-radius: 8px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim);
    transition: all .15s;
  }
  .tool:hover { color: var(--text); border-color: var(--border-strong); }
  .tool.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .tool-group { display: flex; gap: 4px; padding: 4px; border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(8px); border: 1px solid var(--border); }
  .tool-group .tool { background: none; border: none; padding: 4px 9px; }

  .legend {
    position: absolute; bottom: 12px; left: 12px; z-index: 10;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    padding: 8px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim);
    max-width: calc(100% - 24px);
  }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .ln { display: inline-block; width: 18px; height: 0; border-top: 2px solid currentColor; margin-right: 5px; vertical-align: 3px; }
  .legend button { background: none; border: none; padding: 0; font: inherit; color: inherit; }
  .legend button:hover { color: var(--text); text-decoration: underline; }
  @media (max-width: 720px) { .legend { display: none; } }

  .hint-chip {
    position: absolute; top: 12px; right: 12px; z-index: 12;
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px 8px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border); box-shadow: var(--shadow);
    font-size: 11.5px; color: var(--text-dim); max-width: min(320px, calc(100% - 24px));
    line-height: 1.45;
  }
  .hint-chip b { color: var(--text); font-weight: 600; }
  .hint-chip button { background: none; border: none; color: var(--text-faint); font-size: 15px; line-height: 1; padding: 0 2px; }
  .hint-chip button:hover { color: var(--text); }
  .hint-chip[hidden] { display: none; }
  @media (max-width: 760px) {
    .hint-chip { top: auto; bottom: 12px; left: 12px; right: 12px; max-width: none; }
    .canvas { height: 52vh; min-height: 340px; }
  }

  /* ── SVG styling ────────────────────────────────────────── */
  .layer-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .layer-sub { font-size: 10.5px; }
  .group-title { font-size: 10px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; fill: var(--text-faint); }

  .node { cursor: pointer; }
  .node rect.box {
    fill: var(--node-bg);
    stroke: var(--border-strong);
    stroke-width: 1;
    transition: stroke-width .12s, filter .12s;
  }
  .node:hover rect.box { stroke-width: 2; }
  .node text.label { fill: var(--text); font-size: 11.5px; font-weight: 560; pointer-events: none; }
  .node text.meta  { fill: var(--text-faint); font-size: 9.5px; pointer-events: none; }
  .node rect.accent { stroke: none; }

  .edge { fill: none; stroke-width: 1.2; opacity: .32; transition: opacity .15s, stroke-width .15s; }
  .edge.fk { stroke-dasharray: 2 3; opacity: .26; }
  .edge.policy { stroke-dasharray: 5 3; }
  .edge.scheduled { stroke-dasharray: 7 4; }
  .edge-label { font-size: 9.5px; fill: var(--text-dim); opacity: 0; pointer-events: none; }

  /* focus / dim states */
  /* level of detail: the secondary line is noise once the map is zoomed out */
  #viewport.far .node text.meta { display: none; }
  #viewport.far .group-title { display: none; }

  #viewport.has-focus .node:not(.on) rect.box { opacity: .18; }
  #viewport.has-focus .node:not(.on) text { opacity: .2; }
  #viewport.has-focus .edge:not(.on) { opacity: .05; }
  #viewport.has-focus .group-title, #viewport.has-focus .layer-head { opacity: .35; }

  .edge.on { opacity: 1; stroke-width: 2.4; }
  .edge.on + .edge-label, .edge-label.on { opacity: 1; }
  .node.on rect.box { stroke-width: 2.2; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 45%, transparent)); }
  .node.sel rect.box { stroke: var(--accent); stroke-width: 2.6; }

  .flow-link { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 6 5; opacity: .9;
    animation: dash 1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -22; } }

  .step-badge circle { fill: var(--accent); }
  .step-badge text { fill: #041018; font-size: 10px; font-weight: 750; text-anchor: middle; }
  :root[data-theme="light"] .step-badge text { fill: #fff; }

  /* ── Tooltip ────────────────────────────────────────────── */
  #tip {
    position: fixed; z-index: 100; max-width: 340px;
    padding: 11px 13px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--border-strong);
    box-shadow: var(--shadow);
    pointer-events: none; opacity: 0; transform: translateY(4px);
    transition: opacity .12s, transform .12s;
  }
  #tip.show { opacity: 1; transform: translateY(0); }
  #tip .t-top { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  #tip .t-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  #tip .t-name { font-size: 13px; font-weight: 650; }
  #tip .t-tech { font-size: 11px; color: var(--accent); margin-bottom: 6px; }
  #tip .t-desc { font-size: 12px; color: var(--text-dim); line-height: 1.45; }
  #tip .t-file {
    margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border);
    font: 400 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-faint);
    word-break: break-all;
  }

  /* ── Panel ──────────────────────────────────────────────── */
  .panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  @media (max-width: 1024px) { .panel { border-left: none; border-top: 1px solid var(--border); } }

  .panel-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  .tabs { display: flex; gap: 4px; padding: 3px; background: var(--panel-2); border-radius: 9px; margin-bottom: 10px; }
  .tab {
    flex: 1; padding: 6px 10px; border: none; border-radius: 7px; background: none;
    font-size: 12.5px; font-weight: 560; color: var(--text-dim); transition: all .15s;
  }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .search {
    width: 100%; padding: 8px 11px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--text-faint); }

  .panel-body { flex: 1; overflow-y: auto; padding: 10px 12px 28px; min-height: 0; }
  @media (max-width: 1024px) { .panel-body { max-height: none; overflow: visible; } }
  .panel-body::-webkit-scrollbar { width: 9px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 9px; }

  .cat-head {
    font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--text-faint); padding: 12px 6px 6px;
  }
  .flow {
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel-2); margin-bottom: 7px; overflow: hidden;
    transition: border-color .15s, background .15s;
  }
  .flow:hover { border-color: var(--border-strong); }
  .flow.open { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel-2)); }
  .flow-btn {
    display: flex; align-items: flex-start; gap: 9px; width: 100%;
    padding: 10px 11px; border: none; background: none; text-align: left;
  }
  .flow-idx {
    flex: none; width: 20px; height: 20px; border-radius: 6px; margin-top: 1px;
    background: var(--panel); border: 1px solid var(--border);
    font-size: 10.5px; font-weight: 700; color: var(--text-faint);
    display: grid; place-items: center; font-variant-numeric: tabular-nums;
  }
  .flow.open .flow-idx { background: var(--accent); border-color: var(--accent); color: #041018; }
  :root[data-theme="light"] .flow.open .flow-idx { color: #fff; }
  .flow-name { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .flow-sum { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }
  .flow-count { font-size: 10.5px; color: var(--text-faint); margin-top: 5px; }

  .steps { display: none; padding: 2px 11px 12px 40px; }
  .flow.open .steps { display: block; }
  .step {
    position: relative; padding: 7px 0 7px 16px; cursor: pointer;
    border-left: 1.5px solid var(--border-strong);
  }
  .step:last-child { border-left-color: transparent; }
  .step::before {
    content: ''; position: absolute; left: -5.5px; top: 13px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--panel-2); border: 2px solid var(--accent);
  }
  .step:hover { background: var(--accent-soft); border-radius: 0 6px 6px 0; }
  .step-n { font-size: 12px; font-weight: 600; }
  .step-n em { font-style: normal; color: var(--text-faint); font-weight: 500; font-size: 10.5px; margin-left: 6px; }
  .step-a { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; line-height: 1.45; }

  /* component list */
  .comp {
    display: flex; align-items: flex-start; gap: 9px; width: 100%;
    padding: 9px 10px; margin-bottom: 4px;
    border: 1px solid transparent; border-radius: 9px; background: none; text-align: left;
    transition: background .12s, border-color .12s;
  }
  .comp:hover { background: var(--panel-2); border-color: var(--border); }
  .comp.sel { background: var(--accent-soft); border-color: var(--accent); }
  .comp-dot { flex: none; width: 8px; height: 8px; border-radius: 3px; margin-top: 5px; }
  .comp-name { font-size: 12.5px; font-weight: 570; }
  .comp-file { font: 400 10px/1.4 ui-monospace, Menlo, monospace; color: var(--text-faint); margin-top: 2px; word-break: break-all; }

  .detail { padding: 4px 6px 20px; }
  .detail h3 { margin: 0 0 3px; font-size: 15px; font-weight: 650; }
  .detail .d-tech { font-size: 11.5px; color: var(--accent); margin-bottom: 9px; }
  .detail .d-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; }
  .detail .d-file { margin: 10px 0; padding: 8px 10px; border-radius: 8px; background: var(--panel-2);
    font: 400 11px/1.45 ui-monospace, Menlo, monospace; color: var(--text-dim); word-break: break-all; }
  .detail h4 { margin: 16px 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text-faint); }
  .rel { display: block; width: 100%; padding: 6px 9px; margin-bottom: 3px; text-align: left;
    border: 1px solid var(--border); border-radius: 7px; background: var(--panel-2); font-size: 11.5px; }
  .rel:hover { border-color: var(--accent); }
  .rel span { color: var(--text-faint); font-size: 10.5px; }
  .back { margin-bottom: 10px; padding: 5px 10px; border-radius: 7px; background: var(--panel-2);
    border: 1px solid var(--border); font-size: 11.5px; color: var(--text-dim); }
  .empty { padding: 30px 14px; text-align: center; color: var(--text-faint); font-size: 12.5px; }
  .hint { margin: 10px 0 0; padding: 9px 11px; border-radius: 8px; background: var(--panel-2);
    border: 1px solid var(--border); font-size: 11.5px; color: var(--text-dim); line-height: 1.5; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Rumbo</h1>
    <span id="subtitle"></span>
  </div>
  <div class="stats" id="stats"></div>
  <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
</header>

<div class="app">
  <section class="canvas">
    <div class="toolbar">
      <div class="tool-group">
        <button class="tool" data-zoom="in"  title="Acercar (+)">+</button>
        <button class="tool" data-zoom="out" title="Alejar (−)">−</button>
        <button class="tool" data-zoom="fit" title="Ajustar (0)">Ajustar</button>
      </div>
      <button class="tool" id="clearBtn" title="Quitar el resaltado (Esc)">Limpiar</button>
      <button class="tool" id="fkBtn" title="Mostrar/ocultar las claves foráneas entre tablas">Relaciones FK</button>
    </div>
    <div class="hint-chip" id="hint">
      <span>Elige un <b>flujo</b> a la derecha para resaltar su ruta completa. Rueda para acercar, arrastra para mover, clic en un nodo para ver su ficha.</span>
      <button id="hintClose" aria-label="Cerrar aviso">×</button>
    </div>
    <svg id="graph"><g id="viewport"></g></svg>
    <div class="legend" id="legend"></div>
  </section>

  <aside class="panel">
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabFlows" aria-selected="true">Flujos</button>
        <button class="tab" role="tab" id="tabComps" aria-selected="false">Componentes</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Buscar flujo o componente…" autocomplete="off">
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

<div id="tip" role="tooltip"></div>

<script id="graph-data" type="application/json">__GRAPH_DATA__</script>
<script>
(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('graph-data').textContent);
  const { meta, layers, groups, nodes, edges, flows } = DATA;

  const NODE_W = 232, NODE_H = 48, NODE_GAP = 12, GROUP_GAP = 30;
  const COL_GAP = 78, COL_W = NODE_W + COL_GAP, PAD = 56, TOP = 118;

  const byId = new Map(nodes.map(n => [n.id, n]));
  const layerById = new Map(layers.map(l => [l.id, l]));
  const layerColor = id => `var(--l-${id})`;

  /* ── Layout ──────────────────────────────────────────────── */
  const ordered = [...layers].sort((a, b) => a.order - b.order);
  let maxY = 0;
  ordered.forEach((layer, ci) => {
    const x = PAD + ci * COL_W;
    layer.x = x;
    let y = TOP;
    const layerGroups = groups.filter(g => g.layer === layer.id);
    layerGroups.forEach(g => {
      const members = nodes.filter(n => n.group === g.id);
      if (!members.length) return;
      g.x = x; g.y = y;
      y += 20;
      members.forEach(n => { n.x = x; n.y = y; n.w = NODE_W; n.h = NODE_H; y += NODE_H + NODE_GAP; });
      y += GROUP_GAP - NODE_GAP;
    });
    layer.h = y;
    maxY = Math.max(maxY, y);
  });
  const W = PAD * 2 + ordered.length * COL_W - COL_GAP;
  const H = maxY + PAD;

  /* ── SVG scaffolding ─────────────────────────────────────── */
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const svg = document.getElementById('graph');
  const vp = document.getElementById('viewport');

  const defs = el('defs', {}, svg);
  [['a-dim', 'var(--text-faint)', .5], ['a-on', 'var(--accent)', 1]].forEach(([id, color, op]) => {
    const m = el('marker', { id, viewBox: '0 0 8 8', refX: 7, refY: 4,
      markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M0,0 L8,4 L0,8 z', fill: color, opacity: op }, m);
  });

  const gEdges  = el('g', { id: 'edges' }, vp);
  const gFlow   = el('g', { id: 'flowlinks' }, vp);
  const gNodes  = el('g', { id: 'nodes' }, vp);
  const gBadges = el('g', { id: 'badges' }, vp);   // above the nodes, or the step numbers hide under them
  const gDeco   = el('g', { id: 'deco' }, vp);

  /* layer + group headings */
  ordered.forEach(layer => {
    const g = el('g', { class: 'layer-head' }, gDeco);
    el('rect', { x: layer.x, y: 46, width: NODE_W, height: 3, rx: 2,
      fill: layerColor(layer.id), opacity: .85 }, g);
    const t = el('text', { x: layer.x, y: 74, class: 'layer-title', fill: layerColor(layer.id) }, g);
    t.textContent = layer.label;
    const s = el('text', { x: layer.x, y: 90, class: 'layer-sub', fill: 'var(--text-faint)' }, g);
    s.textContent = nodes.filter(n => n.layer === layer.id).length + ' componentes';
  });
  groups.forEach(g => {
    if (g.x === undefined) return;
    const t = el('text', { x: g.x + 2, y: g.y + 11, class: 'group-title' }, gDeco);
    t.textContent = g.label;
  });

  /* ── Edges ───────────────────────────────────────────────── */
  const edgePath = (s, t) => {
    const sy = s.y + s.h / 2, ty = t.y + t.h / 2;
    if (t.x > s.x) {
      const x1 = s.x + s.w, x2 = t.x, dx = Math.max(46, (x2 - x1) * .55);
      return `M${x1},${sy} C${x1 + dx},${sy} ${x2 - dx},${ty} ${x2},${ty}`;
    }
    if (t.x < s.x) {
      const x1 = s.x, x2 = t.x + t.w, dx = Math.max(46, (x1 - x2) * .55);
      return `M${x1},${sy} C${x1 - dx},${sy} ${x2 + dx},${ty} ${x2},${ty}`;
    }
    const x1 = s.x + s.w, bulge = 34 + Math.min(70, Math.abs(ty - sy) * .28);
    return `M${x1},${sy} C${x1 + bulge},${sy} ${x1 + bulge},${ty} ${x1},${ty}`;
  };

  const edgeEls = [];
  edges.forEach((e, i) => {
    const s = byId.get(e.source), t = byId.get(e.target);
    if (!s || !t) return;
    const d = edgePath(s, t);
    const p = el('path', {
      class: 'edge ' + (e.kind || 'call'),
      d, stroke: layerColor(t.layer),
      'marker-end': 'url(#a-dim)'
    }, gEdges);
    const lbl = el('text', { class: 'edge-label' }, gEdges);
    const mid = { x: (s.x + s.w + t.x) / 2, y: (s.y + t.y) / 2 + NODE_H / 2 - 6 };
    lbl.setAttribute('x', mid.x); lbl.setAttribute('y', mid.y);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.textContent = e.label || '';
    e._p = p; e._l = lbl; e._i = i;
    edgeEls.push(e);
  });

  /* ── Nodes ───────────────────────────────────────────────── */
  const wrap = (text, max, lines) => {
    const words = String(text).split(/\s+/);
    const out = []; let cur = '';
    for (const w of words) {
      const next = cur ? cur + ' ' + w : w;
      if (next.length <= max) { cur = next; continue; }
      if (cur) out.push(cur);
      cur = w.length > max ? w.slice(0, max - 1) + '…' : w;
      if (out.length === lines) break;
    }
    if (cur && out.length < lines) out.push(cur);
    if (out.length === lines && words.join(' ').length > out.join(' ').length + 1) {
      out[lines - 1] = out[lines - 1].slice(0, max - 1).replace(/[\s·]+$/, '') + '…';
    }
    return out;
  };

  nodes.forEach(n => {
    const g = el('g', { class: 'node', 'data-id': n.id, tabindex: '0', role: 'button' }, gNodes);
    el('rect', { class: 'box', x: n.x, y: n.y, width: n.w, height: n.h, rx: 9,
      stroke: layerColor(n.layer) }, g);
    el('rect', { class: 'accent', x: n.x, y: n.y + 9, width: 3, height: n.h - 18, rx: 1.5,
      fill: layerColor(n.layer) }, g);

    const lines = wrap(n.label, 29, 2);
    const hasMeta = !!n.tech && lines.length === 1;
    const baseY = lines.length === 1 ? (hasMeta ? n.y + 21 : n.y + 28) : n.y + 20;
    lines.forEach((ln, i) => {
      const t = el('text', { class: 'label', x: n.x + 13, y: baseY + i * 14 }, g);
      t.textContent = ln;
    });
    if (hasMeta) {
      const m = el('text', { class: 'meta', x: n.x + 13, y: n.y + 35 }, g);
      m.textContent = wrap(n.tech, 34, 1)[0] || '';
    }
    n._g = g;
  });

  /* ── Pan & zoom ──────────────────────────────────────────── */
  let scale = 1, tx = 0, ty = 0;
  const applyView = () => {
    vp.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
    vp.classList.toggle('far', scale < 0.62);
  };
  const viewBox = () => svg.getBoundingClientRect();

  function fitTo(box, maxScale = 1.05, padding = 70, minScale = 0.12) {
    const r = viewBox();
    const pad = Math.min(padding, r.width * 0.08, r.height * 0.08);
    const s = Math.min((r.width - pad * 2) / box.w, (r.height - pad * 2) / box.h);
    scale = Math.max(minScale, Math.min(maxScale, s));
    tx = r.width / 2 - (box.x + box.w / 2) * scale;
    ty = r.height / 2 - (box.y + box.h / 2) * scale;
    applyView();
  }
  const fitAll = () => fitTo({ x: 0, y: 0, w: W, h: H }, 1);

  function zoomBy(f, cx, cy) {
    const r = viewBox();
    cx = cx ?? r.width / 2; cy = cy ?? r.height / 2;
    const ns = Math.max(0.12, Math.min(2.6, scale * f));
    tx = cx - (cx - tx) * (ns / scale);
    ty = cy - (cy - ty) * (ns / scale);
    scale = ns; applyView();
  }

  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = viewBox();
    zoomBy(Math.exp(-ev.deltaY * 0.0016), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });

  let drag = null;
  svg.addEventListener('pointerdown', ev => {
    if (ev.target.closest('.node')) return;
    drag = { x: ev.clientX, y: ev.clientY, tx, ty };
    svg.classList.add('dragging'); svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev => {
    if (!drag) return;
    tx = drag.tx + (ev.clientX - drag.x);
    ty = drag.ty + (ev.clientY - drag.y);
    applyView();
  });
  const endDrag = () => { drag = null; svg.classList.remove('dragging'); };
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.zoom;
    if (k === 'fit') fitAll(); else zoomBy(k === 'in' ? 1.28 : 1 / 1.28);
  }));

  /* ── Tooltip ─────────────────────────────────────────────── */
  const tip = document.getElementById('tip');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function showTip(n, ev) {
    tip.innerHTML =
      `<div class="t-top"><span class="t-dot" style="background:${layerColor(n.layer)}"></span>` +
      `<span class="t-name">${esc(n.label)}</span></div>` +
      (n.tech ? `<div class="t-tech">${esc(n.tech)}</div>` : '') +
      `<div class="t-desc">${esc(n.description)}</div>` +
      (n.file && n.file !== '—' ? `<div class="t-file">${esc(n.file)}</div>` : '');
    tip.classList.add('show');
    moveTip(ev);
  }
  function moveTip(ev) {
    const r = tip.getBoundingClientRect();
    let x = ev.clientX + 16, y = ev.clientY + 16;
    if (x + r.width > innerWidth - 10) x = ev.clientX - r.width - 16;
    if (y + r.height > innerHeight - 10) y = Math.max(10, ev.clientY - r.height - 16);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  const hideTip = () => tip.classList.remove('show');

  /* ── Focus / highlight engine ────────────────────────────── */
  let activeFlow = null, activeNode = null;

  function clearFocus() {
    vp.classList.remove('has-focus');
    gFlow.textContent = '';
    gBadges.textContent = '';
    nodes.forEach(n => n._g.classList.remove('on', 'sel'));
    edgeEls.forEach(e => { e._p.classList.remove('on'); e._l.classList.remove('on');
      e._p.setAttribute('marker-end', 'url(#a-dim)'); });
  }

  function focusNode(id, { center = false } = {}) {
    activeFlow = null; activeNode = id;
    clearFocus();
    const n = byId.get(id); if (!n) return;
    vp.classList.add('has-focus');
    n._g.classList.add('on', 'sel');
    edgeEls.forEach(e => {
      if (e.source !== id && e.target !== id) return;
      e._p.classList.add('on'); e._l.classList.add('on');
      e._p.setAttribute('marker-end', 'url(#a-on)');
      e._p.setAttribute('stroke', 'var(--accent)');
      byId.get(e.source === id ? e.target : e.source)?._g.classList.add('on');
    });
    if (center) {
      const b = { x: n.x - 300, y: n.y - 200, w: n.w + 600, h: n.h + 400 };
      fitTo(b, 1.05, 40);
    }
    renderDetail(n);
    document.querySelectorAll('.comp').forEach(c =>
      c.classList.toggle('sel', c.dataset.id === id));
  }

  const edgeKey = new Map();
  edgeEls.forEach(e => { edgeKey.set(e.source + '>' + e.target, e); });

  function focusFlow(flow) {
    activeNode = null; activeFlow = flow.id;
    clearFocus();
    vp.classList.add('has-focus');

    const seen = new Set();
    flow.steps.forEach((s, i) => {
      const n = byId.get(s.node); if (!n) return;
      n._g.classList.add('on');
      if (!seen.has(n.id)) {
        seen.add(n.id);
        const b = el('g', { class: 'step-badge' }, gBadges);
        el('circle', { cx: n.x + n.w - 11, cy: n.y + 11, r: 9 }, b);
        const t = el('text', { x: n.x + n.w - 11, y: n.y + 14.5 }, b);
        t.textContent = i + 1;
      }
    });

    for (let i = 0; i < flow.steps.length - 1; i++) {
      const a = byId.get(flow.steps[i].node), b = byId.get(flow.steps[i + 1].node);
      if (!a || !b || a === b) continue;
      const e = edgeKey.get(a.id + '>' + b.id) || edgeKey.get(b.id + '>' + a.id);
      if (e) {
        e._p.classList.add('on'); e._l.classList.add('on');
        e._p.setAttribute('stroke', 'var(--accent)');
        e._p.setAttribute('marker-end', 'url(#a-on)');
      } else {
        el('path', { class: 'flow-link', d: edgePath(a, b), 'marker-end': 'url(#a-on)' }, gFlow);
      }
    }

    const xs = flow.steps.map(s => byId.get(s.node)).filter(Boolean);
    if (xs.length) {
      const x0 = Math.min(...xs.map(n => n.x)), x1 = Math.max(...xs.map(n => n.x + n.w));
      const y0 = Math.min(...xs.map(n => n.y)), y1 = Math.max(...xs.map(n => n.y + n.h));
      // On a narrow canvas a whole flow fits only at an unreadable zoom, so we
      // stop at 0.34 and let the step list drive navigation instead.
      fitTo({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 }, 1.0, 90, 0.34);
    }
  }

  /* ── Node interactions ───────────────────────────────────── */
  gNodes.addEventListener('pointerover', ev => {
    const g = ev.target.closest('.node'); if (!g) return;
    showTip(byId.get(g.dataset.id), ev);
  });
  gNodes.addEventListener('pointermove', ev => { if (tip.classList.contains('show')) moveTip(ev); });
  gNodes.addEventListener('pointerout', ev => { if (ev.target.closest('.node')) hideTip(); });
  gNodes.addEventListener('click', ev => {
    const g = ev.target.closest('.node'); if (!g) return;
    setTab('comps');
    focusNode(g.dataset.id);
  });
  gNodes.addEventListener('keydown', ev => {
    const g = ev.target.closest('.node'); if (!g) return;
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); setTab('comps'); focusNode(g.dataset.id); }
  });

  /* ── Panel ───────────────────────────────────────────────── */
  const body = document.getElementById('panelBody');
  const searchEl = document.getElementById('search');
  const tabFlows = document.getElementById('tabFlows');
  const tabComps = document.getElementById('tabComps');
  let tab = 'flows', query = '';

  function setTab(t) {
    if (tab === t) return;
    tab = t;
    tabFlows.setAttribute('aria-selected', String(t === 'flows'));
    tabComps.setAttribute('aria-selected', String(t === 'comps'));
    searchEl.placeholder = t === 'flows' ? 'Buscar flujo…' : 'Buscar componente…';
    render();
  }
  tabFlows.addEventListener('click', () => setTab('flows'));
  tabComps.addEventListener('click', () => { setTab('comps'); });
  searchEl.addEventListener('input', () => { query = searchEl.value.trim().toLowerCase(); render(); });

  const matches = (hay, q) => !q || hay.toLowerCase().includes(q);

  function renderFlows() {
    const cats = [];
    flows.forEach((f, i) => {
      const hay = f.name + ' ' + f.summary + ' ' + f.category + ' ' +
        f.steps.map(s => (byId.get(s.node)?.label || '') + ' ' + s.action).join(' ');
      if (!matches(hay, query)) return;
      let c = cats.find(c => c.name === f.category);
      if (!c) cats.push(c = { name: f.category, items: [] });
      c.items.push({ f, i });
    });
    if (!cats.length) return `<div class="empty">Ningún flujo coincide con “${esc(query)}”.</div>`;

    return cats.map(c => `<div class="cat-head">${esc(c.name)}</div>` + c.items.map(({ f, i }) => {
      const open = activeFlow === f.id;
      return `<div class="flow ${open ? 'open' : ''}" data-flow="${f.id}">
        <button class="flow-btn">
          <span class="flow-idx">${i + 1}</span>
          <span style="min-width:0">
            <span class="flow-name">${esc(f.name)}</span>
            <div class="flow-sum">${esc(f.summary)}</div>
            <div class="flow-count">${f.steps.length} pasos${open ? '' : ' · pulsa para resaltar la ruta'}</div>
          </span>
        </button>
        <div class="steps">${f.steps.map((s, si) => {
          const n = byId.get(s.node);
          return `<div class="step" data-node="${esc(s.node)}">
            <div class="step-n">${si + 1}. ${esc(n ? n.label : s.node)}
              <em>${esc(n ? (layerById.get(n.layer)?.label || '') : '')}</em></div>
            <div class="step-a">${esc(s.action)}</div>
          </div>`;
        }).join('')}</div>
      </div>`;
    }).join('')).join('');
  }

  function renderComps() {
    const out = [];
    ordered.forEach(l => {
      const items = nodes.filter(n => n.layer === l.id &&
        matches(n.label + ' ' + n.description + ' ' + (n.file || '') + ' ' + (n.tech || ''), query));
      if (!items.length) return;
      out.push(`<div class="cat-head" style="color:${layerColor(l.id)}">${esc(l.label)}</div>`);
      items.forEach(n => out.push(
        `<button class="comp ${activeNode === n.id ? 'sel' : ''}" data-id="${n.id}">
          <span class="comp-dot" style="background:${layerColor(n.layer)}"></span>
          <span style="min-width:0">
            <span class="comp-name">${esc(n.label)}</span>
            ${n.file && n.file !== '—' ? `<div class="comp-file">${esc(n.file)}</div>` : ''}
          </span>
        </button>`));
    });
    return out.length ? out.join('') : `<div class="empty">Ningún componente coincide con “${esc(query)}”.</div>`;
  }

  function renderDetail(n) {
    const ins = edges.filter(e => e.target === n.id);
    const outs = edges.filter(e => e.source === n.id);
    const rel = (list, dir) => list.map(e => {
      const o = byId.get(dir === 'out' ? e.target : e.source);
      return `<button class="rel" data-id="${o?.id}">${dir === 'out' ? '→' : '←'} ${esc(o?.label || '')}
        <span>${esc(e.label || '')}</span></button>`;
    }).join('') || '<div class="empty" style="padding:8px 0">—</div>';

    const inFlows = flows.filter(f => f.steps.some(s => s.node === n.id));

    body.innerHTML = `<div class="detail">
      <button class="back" id="backBtn">← Volver a la lista</button>
      <h3>${esc(n.label)}</h3>
      ${n.tech ? `<div class="d-tech">${esc(n.tech)} · ${esc(layerById.get(n.layer)?.label || '')}</div>` : ''}
      <div class="d-desc">${esc(n.description)}</div>
      ${n.file && n.file !== '—' ? `<div class="d-file">${esc(n.file)}</div>` : ''}
      <h4>Depende de (${outs.length})</h4>${rel(outs, 'out')}
      <h4>Usado por (${ins.length})</h4>${rel(ins, 'in')}
      ${inFlows.length ? `<h4>Aparece en ${inFlows.length} flujo${inFlows.length > 1 ? 's' : ''}</h4>` +
        inFlows.map(f => `<button class="rel" data-flow="${f.id}">▸ ${esc(f.name)}</button>`).join('') : ''}
    </div>`;
  }

  function render() {
    body.innerHTML = tab === 'flows' ? renderFlows() : renderComps();
    // Only when the panel is its own scroll container. In the stacked phone
    // layout the page itself scrolls, and this would jump the map off-screen.
    if (tab === 'flows' && activeFlow && innerWidth > 1024) {
      const open = body.querySelector('.flow.open');
      if (open) open.scrollIntoView({ block: 'nearest' });
    }
  }

  body.addEventListener('click', ev => {
    const back = ev.target.closest('#backBtn');
    if (back) { activeNode = null; clearFocus(); render(); return; }

    const relBtn = ev.target.closest('.rel');
    if (relBtn) {
      if (relBtn.dataset.flow) {
        const f = flows.find(x => x.id === relBtn.dataset.flow);
        if (f) { setTab('flows'); activeFlow = f.id; focusFlow(f); render(); }
      } else if (relBtn.dataset.id) focusNode(relBtn.dataset.id, { center: true });
      return;
    }

    const comp = ev.target.closest('.comp');
    if (comp) { focusNode(comp.dataset.id, { center: true }); return; }

    const step = ev.target.closest('.step');
    if (step) {
      const n = byId.get(step.dataset.node);
      if (n) fitTo({ x: n.x - 340, y: n.y - 230, w: n.w + 680, h: n.h + 460 }, 1.05, 40);
      return;
    }

    const card = ev.target.closest('.flow');
    if (card) {
      const f = flows.find(x => x.id === card.dataset.flow);
      if (!f) return;
      if (activeFlow === f.id) { activeFlow = null; clearFocus(); fitAll(); }
      else { activeFlow = f.id; focusFlow(f); }
      render();
    }
  });

  body.addEventListener('pointerover', ev => {
    const step = ev.target.closest('.step'); if (!step) return;
    const n = byId.get(step.dataset.node); if (n) showTip(n, ev);
  });
  body.addEventListener('pointermove', ev => { if (tip.classList.contains('show')) moveTip(ev); });
  body.addEventListener('pointerout', ev => { if (ev.target.closest('.step')) hideTip(); });

  /* ── Toolbar extras ──────────────────────────────────────── */
  document.getElementById('clearBtn').addEventListener('click', () => {
    activeFlow = null; activeNode = null; clearFocus(); fitAll(); render();
  });

  let fkOn = true;
  const fkBtn = document.getElementById('fkBtn');
  fkBtn.classList.add('active');
  fkBtn.addEventListener('click', () => {
    fkOn = !fkOn;
    fkBtn.classList.toggle('active', fkOn);
    edgeEls.forEach(e => { if (e.kind === 'fk') e._p.style.display = fkOn ? '' : 'none'; });
  });

  const themeBtn = document.getElementById('themeBtn');
  const root = document.documentElement;
  const store = (() => { try { return localStorage; } catch { return null; } })();
  const urlTheme = new URLSearchParams(location.search).get('theme');
  const startTheme = urlTheme || store?.getItem('af-arch-theme') ||
    (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  root.setAttribute('data-theme', startTheme === 'light' ? 'light' : 'dark');
  themeBtn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { store?.setItem('af-arch-theme', next); } catch {}
  });

  addEventListener('keydown', ev => {
    if (ev.target.matches('input')) return;
    if (ev.key === 'Escape') { activeFlow = null; activeNode = null; clearFocus(); fitAll(); render(); }
    if (ev.key === '0') fitAll();
    if (ev.key === '+' || ev.key === '=') zoomBy(1.28);
    if (ev.key === '-') zoomBy(1 / 1.28);
  });

  /* ── Header + legend ─────────────────────────────────────── */
  document.getElementById('subtitle').textContent = 'Mapa de arquitectura interactivo';
  const c = meta.counts || {};
  document.getElementById('stats').innerHTML = [
    ['Componentes', nodes.length], ['Conexiones', edges.length], ['Flujos', flows.length],
    ['Tablas', c.tables], ['Funciones SQL', c.sqlFunctions], ['Migraciones', c.migrations]
  ].filter(([, v]) => v != null)
   .map(([k, v]) => `<span class="stat">${k} <b>${v}</b></span>`).join('');

  const legend = document.getElementById('legend');
  legend.innerHTML =
    ordered.map(l => `<button data-layer="${l.id}" title="Ir a la capa ${esc(l.label)}">
      <i style="background:${layerColor(l.id)}"></i>${esc(l.label)}</button>`).join('') +
    `<span style="color:var(--accent)"><span class="ln"></span>ruta del flujo</span>`;
  legend.addEventListener('click', ev => {
    const b = ev.target.closest('[data-layer]'); if (!b) return;
    const l = layerById.get(b.dataset.layer); if (!l) return;
    fitTo({ x: l.x - 30, y: 40, w: NODE_W + 60, h: (l.h || H) - 20 }, 0.9, 40);
  });

  const hint = document.getElementById('hint');
  document.getElementById('hintClose').addEventListener('click', () => { hint.hidden = true; });

  /* ── Deep links (#flow-… / #node-…) ──────────────────────── */
  function syncHash() {
    const h = activeFlow ? '#' + activeFlow : activeNode ? '#node-' + activeNode : '';
    if (location.hash !== h) history.replaceState(null, '', h || location.pathname);
  }
  function applyHash() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!h) return false;
    if (h.startsWith('node-')) {
      const id = h.slice(5);
      if (!byId.has(id)) return false;
      // focusNode paints the detail view itself — re-rendering here would wipe it.
      setTab('comps'); focusNode(id, { center: true }); return true;
    }
    const f = flows.find(x => x.id === h);
    if (!f) return false;
    activeFlow = f.id; focusFlow(f); render();
    return true;
  }

  const _focusFlow = focusFlow, _focusNode = focusNode;
  focusFlow = f => { _focusFlow(f); hint.hidden = true; syncHash(); };
  focusNode = (id, o) => { _focusNode(id, o); hint.hidden = true; syncHash(); };
  const _clearFocus = clearFocus;
  clearFocus = () => { _clearFocus(); if (!activeFlow && !activeNode) syncHash(); };

  /* ── Boot ────────────────────────────────────────────────── */
  render();
  fitAll();
  if (!applyHash()) setTimeout(() => { hint.hidden = false; }, 0);
  addEventListener('hashchange', applyHash);
  addEventListener('resize', () => { if (!activeFlow && !activeNode) fitAll(); });
})();
</script>
</body>
</html>
